imageGrip.addEventListener('pointermove', event => {
  if (imageDrag?.pointerId !== event.pointerId || !canEditVisual()) return;
  const { bounds, x, y } = imageDrag;
  const horizontal = event.clientX - x;
  const vertical = (event.clientY - y) * bounds.width / Math.max(1, bounds.height);
  const delta = Math.abs(horizontal) >= Math.abs(vertical) ? horizontal : vertical;
  if (delta || selectedImage.getAttribute('width') !== imageDrag.width) resizeImage(bounds.width + delta);
});

function endImageDrag(apply) {
  if (!imageDrag) return;
  const before = imageDrag.width;
  imageDrag = null;
  if (before === selectedImage.getAttribute('width')) return;
  if (apply) commitImageResize();
  else if (before === null) selectedImage.removeAttribute('width');
  else selectedImage.setAttribute('width', before);
  positionImageResize();
}

imageGrip.addEventListener('pointerup', event => {
  if (imageDrag?.pointerId === event.pointerId) endImageDrag(canEditVisual());
});
imageGrip.addEventListener('lostpointercapture', () => endImageDrag(false));

imageGrip.addEventListener('keydown', event => {
  if (!selectedImage || !canEditVisual()) return;
  const size = selectedImage.getBoundingClientRect().width;
  const step = event.shiftKey ? 40 : 10;
  const { min, max } = imageWidthLimits();
  const width = { ArrowLeft: size - step, ArrowDown: size - step, ArrowRight: size + step,
    ArrowUp: size + step, Home: min, End: max }[event.key];
  if (width === undefined) return;
  event.preventDefault();
  resizeImage(width);
  commitImageResize();
});

const editorLinkSelector = 'a[data-wiki], a[data-href]';

function editorLinkTarget(link, from = current) {
  const wiki = link.dataset.wiki;
  const target = wiki || link.dataset.href || '';
  if (!target || /^(?:[a-z][\w+.-]*:|\/\/)/i.test(target)) return { target };
  const hash = target.indexOf('#');
  const anchor = hash < 0 ? '' : target.slice(hash + 1);
  return { target, path: findTarget(target, Boolean(wiki), from), anchor };
}

async function followEditorLink(link, from = current) {
  const { target, path, anchor } = editorLinkTarget(link, from);
  closeLinkPreview();
  if (/^(?:https?:\/\/|mailto:)/i.test(target)) {
    window.open(target, '_blank', 'noopener,noreferrer');
    return;
  }
  if (!path) {
    toast('Documento non trovato: ' + target);
    return;
  }
  if (isImage(path)) {
    await openLinkedImage(path);
    return;
  }
  if (path === current) jump(anchor);
  else await openPath(path, false, anchor);
}

async function openLinkedImage(path) {
  const activeVersion = version;
  let url;
  try {
    url = URL.createObjectURL(await files.get(path).getFile());
    const image = new Image();
    image.alt = path.split('/').pop();
    image.src = url;
    await image.decode();
    if (activeVersion !== version || imagePreview.open || $('dialog').open) return;
    showImagePreview(image);
    if (imagePreview.open) {
      const previewUrl = url;
      imagePreview.addEventListener('close', () => URL.revokeObjectURL(previewUrl), { once: true });
      url = null;
    }
  } catch {
    toast('Impossibile aprire l’immagine «' + path + '».');
  } finally {
    if (url) URL.revokeObjectURL(url);
  }
}

const linkPreview = $('linkPreview');
const linkPreviewBody = $('linkPreviewBody');
let previewedLink = null;
let linkPreviewOpenTimer;
let linkPreviewCloseTimer;

function closeLinkPreview() {
  clearTimeout(linkPreviewOpenTimer);
  clearTimeout(linkPreviewCloseTimer);
  if (!previewedLink) return;
  previewedLink.link.removeAttribute('aria-expanded');
  previewedLink.link.removeAttribute('aria-controls');
  for (const url of previewedLink.urls) URL.revokeObjectURL(url);
  previewedLink = null;
  linkPreview.hidden = true;
  linkPreviewBody.replaceChildren();
}

function positionLinkPreview() {
  if (linkPreview.hidden || !previewedLink) return;
  const anchor = previewedLink.link.getBoundingClientRect();
  const viewport = workspace.getBoundingClientRect();
  if (anchor.bottom <= viewport.top || anchor.top >= viewport.bottom || !previewedLink.link.isConnected) {
    closeLinkPreview();
    return;
  }
  const margin = 10;
  const gap = 6;
  const width = linkPreview.offsetWidth;
  const fullHeight = Math.min(410, linkPreviewBody.scrollHeight + linkPreview.firstElementChild.offsetHeight + 2);
  const below = innerHeight - anchor.bottom - margin;
  const above = anchor.top - margin;
  const showBelow = below >= fullHeight + gap || below >= above;
  linkPreview.style.maxHeight = Math.max(0, Math.min(410, (showBelow ? below : above) - gap)) + 'px';
  const height = linkPreview.offsetHeight;
  const top = showBelow ? anchor.bottom + gap : anchor.top - gap - height;
  linkPreview.style.top = Math.max(margin, Math.min(top, innerHeight - height - margin)) + 'px';
  linkPreview.style.left = Math.max(margin, Math.min(anchor.left, innerWidth - width - margin)) + 'px';
}

function previewStillCurrent(state) {
  return previewedLink === state && state.link.isConnected && state.version === version && state.root === root;
}

async function loadPreviewImages(state) {
  for (const image of linkPreviewBody.querySelectorAll('img[data-src]')) {
    try {
      const file = await documentImage(image, state.path);
      if (!previewStillCurrent(state)) return;
      if (!file) continue;
      const url = URL.createObjectURL(file);
      state.urls.push(url);
      image.loading = 'lazy';
      image.src = url;
    } catch {}
  }
}

async function showLinkPreview(state) {
  if (!previewStillCurrent(state)) return;
  let fragment;
  try {
    if (isImage(state.path)) {
      const file = await files.get(state.path).getFile();
      if (!previewStillCurrent(state)) return;
      const image = new Image();
      image.alt = state.path.split('/').pop();
      const url = URL.createObjectURL(file);
      state.urls.push(url);
      image.src = url;
      await image.decode();
      if (!previewStillCurrent(state)) return;
      fragment = document.createDocumentFragment();
      fragment.append(image);
    } else {
      const text = state.path === current ? getMarkdown() : await (await files.get(state.path).getFile()).text();
      if (!previewStillCurrent(state)) return;
      fragment = sanitize(parseDocumentMarkdown(frontSplit(text)[1]));
      decorateCheckboxes(fragment);
      for (const code of fragment.querySelectorAll('pre code')) {
        renderHighlightedCode(code, code.textContent, codeLanguage(code));
      }
    }
  } catch {
    if (previewStillCurrent(state)) closeLinkPreview();
    return;
  }

  const heading = headingAtAnchor(fragment, state.anchor);
  if (heading) heading.dataset.previewHeading = '';
  const title = $('linkPreviewTitle');
  const folder = $('linkPreviewFolder');
  title.textContent = state.path.split('/').pop();
  title.title = state.path;
  folder.textContent = parent(state.path);
  folder.hidden = !folder.textContent;
  $('linkPreviewOpen').setAttribute('aria-label', isImage(state.path) ? 'Apri immagine in anteprima' : 'Apri documento in anteprima');
  if (fragment.childNodes.length) linkPreviewBody.replaceChildren(fragment);
  else linkPreviewBody.textContent = 'Documento vuoto.';
  for (const link of linkPreviewBody.querySelectorAll(editorLinkSelector)) {
    link.tabIndex = 0;
    link.setAttribute('role', 'link');
    link.title = 'Apri collegamento';
  }
  for (const checkbox of linkPreviewBody.querySelectorAll('input')) checkbox.disabled = true;
  linkPreview.hidden = false;
  state.link.setAttribute('aria-controls', 'linkPreview');
  state.link.setAttribute('aria-expanded', 'true');
  positionLinkPreview();
  linkPreviewBody.scrollTop = heading ? heading.getBoundingClientRect().top - linkPreviewBody.getBoundingClientRect().top - 12 : 0;
  loadPreviewImages(state);
}

function queueLinkPreview(link, delay) {
  if (previewedLink?.link === link) {
    clearTimeout(linkPreviewCloseTimer);
    return;
  }
  closeLinkPreview();
  if (documentOpening || folderOpening || fileActionBusy || $('dialog').open || $('imagePreview').open) return;
  const { path, anchor } = editorLinkTarget(link);
  if (!path || (!isMD(path) && !isImage(path)) || (path !== current && !files.has(path))) return;
  const state = { link, path, anchor, root, version, urls: [] };
  previewedLink = state;
  linkPreviewOpenTimer = setTimeout(() => showLinkPreview(state), delay);
}

function queueCloseLinkPreview(relatedTarget) {
  if (!previewedLink || (relatedTarget instanceof Node &&
      (previewedLink.link.contains(relatedTarget) || linkPreview.contains(relatedTarget)))) return;
  if (linkPreview.hidden) {
    closeLinkPreview();
    return;
  }
  clearTimeout(linkPreviewCloseTimer);
  linkPreviewCloseTimer = setTimeout(closeLinkPreview, 180);
}

ed.addEventListener('pointerover', event => {
  if (event.pointerType === 'touch' || event.buttons) return;
  const link = event.target.closest(editorLinkSelector);
  if (link) queueLinkPreview(link, 280);
});
ed.addEventListener('pointerout', event => {
  const link = event.target.closest(editorLinkSelector);
  if (link && link === previewedLink?.link) queueCloseLinkPreview(event.relatedTarget);
});
ed.addEventListener('focusin', event => {
  updateFormatButtons();
  if (event.target.matches('input[type=checkbox]')) decorateCheckbox(event.target);
  if (event.target.matches(editorLinkSelector) && event.target.matches(':focus-visible')) {
    queueLinkPreview(event.target, 160);
  }
});
ed.addEventListener('focusout', event => {
  if (event.target === previewedLink?.link) queueCloseLinkPreview(event.relatedTarget);
});
linkPreview.addEventListener('pointerenter', () => clearTimeout(linkPreviewCloseTimer));
linkPreview.addEventListener('pointerleave', event => queueCloseLinkPreview(event.relatedTarget));
linkPreview.addEventListener('focusin', () => clearTimeout(linkPreviewCloseTimer));
linkPreview.addEventListener('focusout', event => queueCloseLinkPreview(event.relatedTarget));
linkPreviewBody.addEventListener('click', event => {
  const link = event.target.closest(editorLinkSelector);
  if (link && previewedLink) followEditorLink(link, previewedLink.path);
});
linkPreviewBody.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.matches(editorLinkSelector)) event.target.click();
});
$('linkPreviewOpen').onclick = () => {
  if (previewedLink) followEditorLink(previewedLink.link);
};
document.addEventListener('pointerdown', event => {
  if (previewedLink && !linkPreview.contains(event.target) && !previewedLink.link.contains(event.target)) closeLinkPreview();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && previewedLink) {
    const link = previewedLink.link;
    if (linkPreview.contains(document.activeElement)) link.focus({ preventScroll: true });
    closeLinkPreview();
  }
});
workspace.addEventListener('scroll', positionLinkPreview);
window.addEventListener('resize', positionLinkPreview);
new ResizeObserver(positionLinkPreview).observe(linkPreview);

ed.addEventListener('click', event => {
  remember();
  updateFormatButtons();
  if (event.target.type === 'checkbox') return;
  const image = event.target.closest('img[data-src]');
  const link = event.target.closest('a[data-wiki], a[data-href]');
  if (image?.naturalWidth && (!link || !(event.ctrlKey || event.metaKey))) {
    event.preventDefault();
    if (canEditVisual()) selectImageForResize(image);
    else if (!editingEnabled) showImagePreview(image);
    return;
  }
  if (selectedImage) selectImageForResize(null);
  if (link && (!editingEnabled || event.ctrlKey || event.metaKey)) {
    event.preventDefault();
    followEditorLink(link);
  }
});

ed.addEventListener('keydown', event => {
  if (event.key !== 'Enter') return;
  const target = event.target;
  if (target.matches('img[src^="blob:"]')) {
    event.preventDefault();
    target.click();
    if (canEditVisual()) imageGrip.focus();
  } else if (!editingEnabled && target.matches('a[data-wiki], a[data-href]')) {
    event.preventDefault();
    target.click();
  }
});

const caretBoundary = '\u200b';
const inlineKinds = 'code, a[data-wiki], a[data-href]';
const lineBreakTypes = new Set(['insertParagraph', 'insertLineBreak']);
let continuingColor = '';
let continuingCheckbox = null;

function checkboxLine(node) {
  const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
  const line = element?.closest('li, p, div, h1, h2, h3, h4, h5, h6, td, th');
  return ed.contains(line) ? line : null;
}

function checkboxLineAt(node, offset) {
  if (node !== ed) return checkboxLine(node);
  return checkboxLine(ed.childNodes[offset]) || checkboxLine(ed.childNodes[offset - 1]);
}

function checkboxesOnLine(line) {
  if (!line) return [];
  return [...line.querySelectorAll('input[type=checkbox]')].filter(checkbox =>
    checkboxLine(checkbox) === line || (line.matches('li') && checkbox.closest('li') === line));
}

function leadingCheckbox(line) {
  const first = [...line.childNodes].find(node => node.nodeType === Node.ELEMENT_NODE ||
    node.textContent.replaceAll(caretBoundary, '').trim());
  if (first?.matches?.('input[type=checkbox]')) return first;
  if (first?.matches?.('span') && first.childNodes.length === 1 && first.firstChild.matches?.('input[type=checkbox]')) return first.firstChild;
  return null;
}

function prepareCheckboxBreak(event) {
  const selection = getSelection();
  if (!event.cancelable || !selection.rangeCount) return false;
  const range = selection.getRangeAt(0);
  const line = checkboxLine(range.startContainer);
  if (!line || line !== checkboxLine(range.endContainer)) return false;
  const checkbox = leadingCheckbox(line);
  if (!checkbox) return false;
  const after = document.createRange();
  after.setStartAfter(checkboxAnchor(checkbox));
  after.collapse(true);
  if (range.compareBoundaryPoints(Range.START_TO_START, after) < 0) return false;

  const task = checkbox.hasAttribute('data-task-checkbox');
  const item = line.closest('li');
  const content = task && item ? item : line;
  if (!content.textContent.replaceAll(caretBoundary, '').trim() && content.querySelectorAll('img,input,pre,table,ul,ol').length === 1) {
    event.preventDefault();
    range.selectNodeContents(line);
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand('delete');
    if (task && item) document.execCommand('insertParagraph');
    return true;
  }
  continuingCheckbox = { line, task };
  return false;
}

function finishCheckboxBreak() {
  const previous = continuingCheckbox;
  continuingCheckbox = null;
  if (!previous) return;
  const selection = getSelection();
  const node = selection.anchorNode;
  const offset = selection.anchorOffset;
  const line = checkboxLine(node);
  if (!line || line === previous.line || leadingCheckbox(line)) return;
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.contentEditable = 'false';
  if (previous.task && line.closest('li')) checkbox.dataset.taskCheckbox = '';
  line.prepend(checkbox);
  const label = decorateCheckbox(checkbox);
  if (!label.hasChildNodes()) label.append(document.createElement('br'));
  if (label.contains(node)) placeCaret(node, offset);
  else placeCaret(label, 0);
}

function typingColorAtCaret() {
  const selection = getSelection();
  if (!selection.isCollapsed || !ed.contains(selection.anchorNode)) return '';
  const node = selection.anchorNode;
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  const color = document.queryCommandValue('foreColor');
  if (!safeColors.test(color)) return '';
  if (color !== getComputedStyle(element).color) return color;
  for (let ancestor = element; ancestor && ancestor !== ed; ancestor = ancestor.parentElement) {
    if ((ancestor.style.color || ancestor.matches('font[color]')) && getComputedStyle(ancestor).color === color) return color;
  }
  return '';
}

function restoreTypingColor(color) {
  const selection = getSelection();
  if (color && selection.isCollapsed && ed.contains(selection.anchorNode) && document.queryCommandValue('foreColor') !== color) {
    document.execCommand('foreColor', false, color);
  }
}

function prepareEditorLineBreak(event) {
  continuingColor = '';
  continuingCheckbox = null;
  if (!lineBreakTypes.has(event.inputType)) return;
  if (event.inputType === 'insertParagraph' && prepareCheckboxBreak(event)) return;
  const color = typingColorAtCaret();
  if (breakAfterInline(event)) restoreTypingColor(color);
  else continuingColor = color;
}

function finishEditorLineBreak(event) {
  if (!lineBreakTypes.has(event.inputType)) return;
  if (event.inputType === 'insertParagraph') finishCheckboxBreak();
  const color = continuingColor;
  continuingColor = '';
  restoreTypingColor(color);
}

function inlineBeforeCaret(range) {
  const { startContainer, startOffset } = range;
  let previous;
  if (startContainer.nodeType === Node.TEXT_NODE) {
    const before = startContainer.data.slice(0, startOffset);
    if (before && (startContainer.parentNode !== ed || before.trim())) return null;
    previous = startContainer.previousSibling;
  } else {
    previous = startContainer.childNodes[startOffset - 1];
  }

  // Browsers can place the caret after the whole paragraph when it ends in code or a link.
  // Ignore whitespace between paragraphs, but stop at visible text or an existing break.
  while (previous) {
    if (previous.nodeType === Node.TEXT_NODE) {
      if (previous.data && (previous.parentNode !== ed || previous.data.trim())) return null;
      previous = previous.previousSibling;
      continue;
    }
    if (previous.nodeType !== Node.ELEMENT_NODE ||
        previous.matches('pre, ul, ol, table, blockquote, [data-caret-boundary], [contenteditable="false"]')) return null;
    if (previous.matches(inlineKinds)) return previous;
    previous = previous.lastChild;
  }
  return null;
}

function activeInline(range, includePrevious = false) {
  const node = range.startContainer;
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  let inline = element?.closest(inlineKinds);
  if (!inline && includePrevious) inline = inlineBeforeCaret(range);
  if (!inline || !ed.contains(inline) || inline.closest('pre')) return null;
  const outerInline = inline.parentElement.closest(inlineKinds);
  return outerInline && ed.contains(outerInline) ? outerInline : inline;
}

function placeCaret(node, offset) {
  getSelection().setPosition(node, offset);
  remember();
  updateFormatButtons();
}

function makeCaretBoundary() {
  const boundary = document.createElement('span');
  boundary.dataset.caretBoundary = '';
  boundary.textContent = caretBoundary;
  return boundary;
}

function editorForMarkdown() {
  if (!ed.querySelector('[data-caret-boundary], [data-code-gap], [data-checkbox-text]')) return ed;
  const copy = ed.cloneNode(true);
  for (const boundary of [...copy.querySelectorAll('[data-caret-boundary]')].reverse()) {
    const content = document.createTreeWalker(boundary, NodeFilter.SHOW_TEXT);
    while (content.nextNode()) {
      const text = content.currentNode;
      const index = text.data.indexOf(caretBoundary);
      if (index < 0) continue;
      text.deleteData(index, 1);
      break;
    }
    if (boundary.textContent || boundary.querySelector('br, img, input')) continue;
    const left = boundary.previousSibling;
    const right = boundary.nextSibling;
    boundary.remove();
    // Undo may reunite the line while leaving the inline element in two pieces.
    if (left?.matches?.(inlineKinds) && right?.tagName === left.tagName &&
        right.dataset.wiki === left.dataset.wiki && right.dataset.href === left.dataset.href) {
      left.append(...right.childNodes);
      right.remove();
    }
  }
  for (const element of copy.querySelectorAll('[data-code-gap], [data-checkbox-text]')) {
    if (emptyVisualText(element)) element.remove();
  }
  return copy;
}

function leaveInline(range, inline) {
  let tail = null;
  if (inline.contains(range.startContainer)) {
    const rest = document.createRange();
    rest.selectNodeContents(inline);
    rest.setStart(range.startContainer, range.startOffset);
    if (rest.toString() || rest.cloneContents().querySelector('img')) {
      tail = inline.cloneNode(false);
      tail.append(rest.extractContents());
    }
  }
  const boundary = makeCaretBoundary();
  inline.after(boundary);
  if (tail?.hasChildNodes()) boundary.after(tail);
  if (!inline.textContent && !inline.querySelector('img')) inline.remove();
  placeCaret(boundary.firstChild, 1);
  return tail;
}

function toggleCheckboxOnLine(task) {
  if (!canEditVisual() || document.activeElement?.closest('pre')) return;
  restore();
  const selection = getSelection();
  const range = selection.getRangeAt(0).cloneRange();
  range.collapse(true);
  const node = range.startContainer;
  const element = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
  if (element?.closest('pre')) return;
  let line = checkboxLineAt(node, range.startOffset);
  if (!line) {
    selected = range;
    command('formatBlock', 'p');
    line = checkboxLine(selection.anchorNode);
    if (!line) return;
  }
  const checkboxes = checkboxesOnLine(line);
  if (checkboxes.length) {
    for (const checkbox of checkboxes.reverse()) {
      if (!ed.contains(checkbox)) continue;
      const deletion = document.createRange();
      deletion.selectNode(checkboxAnchor(checkbox));
      selected = deletion;
      command('delete');
    }
    if (ed.contains(range.startContainer)) placeCaret(range.startContainer, range.startOffset);
    return;
  }

  const listItem = line.closest('li');
  range.selectNodeContents(line);
  const followingBlock = [...line.children].find(child => child.matches('p, div, ul, ol, pre, table, blockquote, hr, h1, h2, h3, h4, h5, h6'));
  const checklist = task && !line.closest('td,th') && (Boolean(listItem) || !followingBlock);
  if (followingBlock) range.setEndBefore(followingBlock);
  const content = document.createElement('div');
  content.append(range.cloneContents());
  const checkbox = '<input type="checkbox" contenteditable="false" data-new-checkbox' + (checklist ? ' data-task-checkbox' : '') + '>';
  let html = checkbox + '<span data-checkbox-text>' + content.innerHTML + '</span>';
  if (checklist && !listItem) {
    range.selectNode(line);
    html = '<ul><li>' + html + '</li></ul>';
  }
  selected = range;
  addHTML(html);
  const inserted = ed.querySelector('[data-new-checkbox]');
  if (!inserted) return;
  delete inserted.dataset.newCheckbox;
  const label = decorateCheckbox(inserted);
  // Chromium can add a break at the boundary with a nested block during insertHTML.
  if (followingBlock && label.lastChild?.nodeName === 'BR' &&
      label.querySelectorAll('br').length > content.querySelectorAll('br').length) label.lastChild.remove();
  if (!label.hasChildNodes()) label.append(document.createElement('br'));
  placeCaret(label, emptyVisualText(label) ? 0 : label.childNodes.length);
}

function insertSpecialInline(html, selectInserted = false) {
  if (!canEditVisual()) return;
  addHTML(html + '<span data-caret-boundary="new">' + caretBoundary + '</span>');
  const boundary = ed.querySelector('[data-caret-boundary="new"]');
  if (!boundary) return;
  boundary.dataset.caretBoundary = '';
  if (selectInserted && boundary.previousElementSibling?.matches('code')) {
    const range = document.createRange();
    range.selectNodeContents(boundary.previousElementSibling);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    remember();
    updateFormatButtons();
  } else if (boundary.firstChild) {
    placeCaret(boundary.firstChild, 1);
  }
}

$('code').onclick = () => {
  if (!canEditVisual()) return;
  restore();
  const selection = getSelection();
  const range = selection.getRangeAt(0);
  const inline = activeInline(range);
  if (inline?.matches('code')) {
    const color = typingColorAtCaret();
    const end = range.cloneRange();
    end.collapse(false);
    leaveInline(end, inline);
    restoreTypingColor(color);
    mark();
    return;
  }
  const text = range.toString();
  insertSpecialInline('<code>' + escapeHtml(text || 'codice') + '</code>', !text);
};

function breakAfterInline(event) {
  if (!event.cancelable) return false;
  const selection = getSelection();
  if (!selection.rangeCount) return false;
  const range = selection.getRangeAt(0);
  const inline = activeInline(range, true);
  if (!inline || (!range.collapsed && !inline.contains(range.endContainer))) return false;

  event.preventDefault();
  if (!range.collapsed) document.execCommand('insertHTML', false, '<span data-caret-boundary>' + caretBoundary + '</span>');
  const caret = selection.getRangeAt(0);
  const tail = inline.isConnected ? leaveInline(caret, inline) : null;
  document.execCommand(event.inputType);
  if (tail?.isConnected) {
    const boundary = makeCaretBoundary();
    tail.before(boundary);
    placeCaret(boundary.firstChild, 1);
  }
  return true;
}

ed.addEventListener('keydown', event => {
  if (event.target.closest('.code-block-body') || event.key !== 'ArrowRight' || event.shiftKey || event.ctrlKey || event.altKey || event.metaKey || !canEditVisual()) return;
  const selection = getSelection();
  if (!selection.rangeCount || !selection.isCollapsed) return;
  const range = selection.getRangeAt(0);
  const inline = activeInline(range);
  if (!inline) return;
  const rest = document.createRange();
  rest.selectNodeContents(inline);
  rest.setStart(range.startContainer, range.startOffset);
  if (rest.toString()) return;
  event.preventDefault();
  const color = typingColorAtCaret();
  leaveInline(range, inline);
  restoreTypingColor(color);
});

const imagePreview = $('imagePreview');
const previewViewport = $('previewViewport');
const previewImage = $('previewImage');
const previewSurface = $('previewSurface');
const maximumZoom = 5;
let previewSize = null;
let previewZoom = 1;
let previewDrag = null;

function showImagePreview(image) {
  if (!image.naturalWidth || imagePreview.open) return;
  previewSize = { width: image.naturalWidth, height: image.naturalHeight };
  previewZoom = 1;
  previewImage.src = image.src;
  previewImage.alt = image.alt;
  $('previewCaption').textContent = image.alt;
  $('previewCaption').hidden = !image.alt;
  imagePreview.showModal();
  resizePreview(1);
}

function resizePreview(zoom, point) {
  if (!previewSize || !imagePreview.open) return;
  const viewport = previewViewport.getBoundingClientRect();
  const x = point?.clientX ?? viewport.left + previewViewport.clientWidth / 2;
  const y = point?.clientY ?? viewport.top + previewViewport.clientHeight / 2;
  const old = previewImage.getBoundingClientRect();
  const anchorX = old.width ? Math.max(0, Math.min(1, (x - old.left) / old.width)) : .5;
  const anchorY = old.height ? Math.max(0, Math.min(1, (y - old.top) / old.height)) : .5;
  previewZoom = Math.max(1, Math.min(maximumZoom, zoom));

  const fit = Math.min(1, previewViewport.clientWidth / previewSize.width, previewViewport.clientHeight / previewSize.height);
  const width = Math.max(1, Math.floor(previewSize.width * fit * previewZoom));
  const height = Math.max(1, Math.floor(previewSize.height * fit * previewZoom));
  previewImage.width = width;
  previewImage.height = height;
  previewSurface.style.width = width + 'px';
  previewSurface.style.height = height + 'px';
  const next = previewImage.getBoundingClientRect();
  previewViewport.scrollLeft += next.left + anchorX * next.width - x;
  previewViewport.scrollTop += next.top + anchorY * next.height - y;
  $('zoomReset').textContent = Math.round(previewZoom * 100) + '%';
  $('zoomOut').disabled = previewZoom <= 1;
  $('zoomIn').disabled = previewZoom >= maximumZoom;
  previewViewport.classList.toggle('is-zoomed', width > previewViewport.clientWidth || height > previewViewport.clientHeight);
}

$('zoomOut').onclick = () => resizePreview(previewZoom / 1.25);
$('zoomIn').onclick = () => resizePreview(previewZoom * 1.25);
$('zoomReset').onclick = () => resizePreview(1);
$('closeImagePreview').onclick = () => imagePreview.close();
imagePreview.onclick = event => { if (event.target === imagePreview) imagePreview.close(); };
imagePreview.addEventListener('close', () => {
  previewSize = null;
  previewDrag = null;
  previewViewport.classList.remove('is-dragging');
  previewImage.removeAttribute('src');
});

previewViewport.addEventListener('wheel', event => {
  if (!event.deltaY) return;
  event.preventDefault();
  resizePreview(previewZoom * (event.deltaY < 0 ? 1.15 : 1 / 1.15), event);
}, { passive: false });

imagePreview.addEventListener('keydown', event => {
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const zoom = { '+': previewZoom * 1.25, '=': previewZoom * 1.25, '-': previewZoom / 1.25, '0': 1 }[event.key];
  if (zoom === undefined) return;
  event.preventDefault();
  resizePreview(zoom);
});

previewViewport.addEventListener('pointerdown', event => {
  if (event.pointerType !== 'mouse' || event.button !== 0 || !previewViewport.classList.contains('is-zoomed')) return;
  previewDrag = { x: event.clientX + previewViewport.scrollLeft, y: event.clientY + previewViewport.scrollTop };
  previewViewport.setPointerCapture(event.pointerId);
  previewViewport.classList.add('is-dragging');
});

previewViewport.addEventListener('pointermove', event => {
  if (previewDrag) previewViewport.scrollTo(previewDrag.x - event.clientX, previewDrag.y - event.clientY);
});

previewViewport.addEventListener('lostpointercapture', () => {
  previewDrag = null;
  previewViewport.classList.remove('is-dragging');
});

window.addEventListener('resize', () => resizePreview(previewZoom));

const workspaceUrl = new URL(location.href);
workspaceUrl.hash = '';
workspaceUrl.search = '';

const previousFolderKey = workspaceUrl.pathname.endsWith('/Itaca%20Lite.html') ? new URL('Quaderno.html', workspaceUrl).href : null;
const readAccess = { mode: 'read' };
const writeAccess = { mode: 'readwrite' };

async function allowFolderWrite(directory) {

  toast('Il browser non ha concesso la scrittura. I file della cartella sono ancora consultabili.');
  return false;
}
const localFolderName = location.protocol === 'file:'
  ? decodeURIComponent(new URL('.', workspaceUrl).pathname.split('/').filter(Boolean).pop() || '')
  : '';
const folderInput = $('folderInput');

let offeredImport = false;
let rememberedFolder = null;

function markdownSnapshot(path, text) {
  const file = new File([text], path.split('/').pop(), { type: 'text/markdown' });
  return { getFile: async () => file };
}
let rememberedPaths = [];
let folderAccessPending = false;
let folderOpening = false;
let folderRevision = 0;
let editRevision = 0;
const draftSessionKey = 'itaca-draft:' + folderKey;
let draftId;
let draftDatabase;
let draftQueued = false;
let draftSequence = 0;
let checkpointRevision = -1;
let reloadApproved = false;
let draftStorageWarning = false;

function openDraftDatabase() {
  return draftDatabase ??= new Promise((resolve, reject) => {
    const request = indexedDB.open('itaca-drafts', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('drafts');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function withDraftStore(mode, operation) {
  return openDraftDatabase().then(db => new Promise((resolve, reject) => {
    const transaction = db.transaction('drafts', mode);
    transaction.onabort = () => reject(transaction.error);
    const request = operation(transaction.objectStore('drafts'));
    transaction.oncomplete = () => resolve(request.result);
  }));
}

function queueDraftCheckpoint() {
  if (draftQueued) return;
  draftQueued = true;
  queueMicrotask(() => {
    draftQueued = false;
    checkpointDraft();
  });
}

function warnDraftStorage(message) {
  if (draftStorageWarning) return;
  draftStorageWarning = true;
  toast(message);
}

function checkpointDraft() {
  if (!dirty || !current || reloadApproved || checkpointRevision === editRevision) return;
  const snapshot = {
    sequence: ++draftSequence, path: current, text: getMarkdown(), original,
    editing: editingEnabled, source: sourceMode, importedFolderName, pendingNewDocument,
  };
  try {
    if (!draftId) {
      const id = folderKey + '#' + crypto.randomUUID();
      sessionStorage.setItem(draftSessionKey, id);
      draftId = id;
    }
  } catch {
    warnDraftStorage('Archiviazione della bozza non disponibile. Premi Salva per conservare le modifiche.');
    return;
  }
  const id = draftId;
  let storedInSession = false;
  try {
    sessionStorage.setItem(id, JSON.stringify(snapshot));
    storedInSession = true;
  } catch {}
  checkpointRevision = editRevision;
  const record = { ...snapshot, folder: root, handle: standalone, images: [...draftImages] };
  withDraftStore('readwrite', store => store.put(record, id)).catch(() => {
    if (draftId !== id || draftSequence !== snapshot.sequence) return;
    if (!storedInSession || record.images.length) {
      checkpointRevision = -1;
      warnDraftStorage(storedInSession ? 'Il browser non riesce a memorizzare gli allegati della bozza. Premi Salva per conservarli.' :
        'Archiviazione della bozza non disponibile. Premi Salva per conservare le modifiche.');
    }
  });
}

function clearDraftCheckpoint() {
  if (!draftId) return;
  const id = draftId;
  draftId = undefined;
  checkpointRevision = -1;
  try {
    sessionStorage.removeItem(draftSessionKey);
    sessionStorage.removeItem(id);
  } catch {}
  withDraftStore('readwrite', store => store.delete(id)).catch(() => {});
}

async function reloadAfterGuard() {
  if (reloadApproved || loading || fileActionBusy || documentOpening || folderOpening || $('dialog').open || $('imagePreview').open) return;
  if (!await guard('Ricarica')) return;
  reloadApproved = true;
  clearDraftCheckpoint();
  location.reload();
}

async function restoreDraft() {
  const revision = folderRevision;
  let id, session;
  try {
    id = sessionStorage.getItem(draftSessionKey);
    if (id) session = JSON.parse(sessionStorage.getItem(id));
  } catch {}
  if (!id) {
    openDraftDatabase().catch(() => {});
    return false;
  }
  const stored = await withDraftStore('readonly', store => store.get(id)).catch(() => null);
  const latest = !stored || session?.sequence > stored.sequence ? session : stored;
  if (!latest || typeof latest.path !== 'string' || !isMD(latest.path) || typeof latest.text !== 'string' ||
      typeof latest.original !== 'string' || current || folderRevision !== revision) return false;

  draftId = id;
  draftSequence = latest.sequence;
  const sameFile = stored?.path === latest.path;
  const folder = sameFile ? stored.folder : null;
  const handle = sameFile ? stored.handle : null;
  if (folder) {
    root = folder;
    rememberedFolder = folder;
    folderHandles.set('', folder);
    if (handle) files.set(latest.path, handle);
    $('rootName').textContent = folder.name;
  } else if (latest.importedFolderName) {
    importedFolderName = latest.importedFolderName;
    files.set(latest.path, markdownSnapshot(latest.path, latest.original));
    $('rootName').textContent = importedFolderName;
    setFolderNote('Cartella importata. Scarica copia esporta le modifiche.');
  }
  resetDoc(latest.original, latest.path, handle, latest.editing);
  pendingNewDocument = Boolean(latest.pendingNewDocument);
  if (sameFile) for (const [path, image] of stored.images || []) draftImages.set(path, image);
  showVisual(latest.text);
  renderMode();
  mark();
  if (latest.source) setMode(true, true);
  renderTree();
  toast('Bozza recuperata. Premi Salva per conservare le modifiche nel documento.');

  if (folder) {
    folder.queryPermission(readAccess).then(async permission => {
      if (permission !== 'granted' || root !== folder) return;
      await scan();
      if (root === folder) loadImages();
    }).catch(() => {});
  }
  return true;
}

async function folderPreference(record) {
  const db = await new Promise((resolve, reject) => {
    const request = indexedDB.open('quaderno-workspaces', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('folders');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  try {
    return await new Promise((resolve, reject) => {
      const transaction = db.transaction('folders', record ? 'readwrite' : 'readonly');
      const store = transaction.objectStore('folders');
      let request = record ? store.put(record, folderKey) : store.get(folderKey);
      if (!record && previousFolderKey) {
        request.onsuccess = () => {
          if (!request.result) request = store.get(previousFolderKey);
        };
      }
      transaction.oncomplete = () => resolve(request.result);
      transaction.onabort = () => reject(transaction.error || request.error);
    });
  } finally {
    db.close();
  }
}

function rememberFolderIndex() {
  return folderPreference({ handle: root, paths: [...files.keys()].filter(isMD) });
}

function clearWorkingFolder() {
  if (hasWorkspaceFolder()) clearDocumentHistory();
  resetSearchIndex();
  root = null;
  importedFolderName = '';
  offeredImport = false;
  setFolderNote();
  folderAccessPending = false;
  files.clear();
  folderHandles.clear();
  search.value = '';
  $('rootName').textContent = 'Documenti';
}

async function showFolder(directory, canSwitch, requestedPath = '') {
  return showFolderIndex(directory.name, await scanFolder(directory), canSwitch, requestedPath, directory);
}

async function showFolderIndex(name, { found, folders }, canSwitch, requestedPath = '', directory = null) {
  const paths = [...found.keys()].filter(isMD).sort((a, b) => a.localeCompare(b, 'it', { numeric: true }));
  const path = requestedPath || paths.find(name => /^readme\.(md|markdown)$/i.test(name)) || paths[0];
  const handle = paths.includes(path) ? found.get(path) : null;
  let text = null;
  if (handle) {
    try { text = await (await handle.getFile()).text(); } catch {}
  }
  if (!canSwitch()) return false;

  clearDocumentHistory();
  resetSearchIndex();
  root = directory;
  importedFolderName = directory ? '' : name;
  offeredImport = false;
  folderAccessPending = false;
  if (directory) rememberedFolder = directory;
  setFolderNote(importedFolderName ? 'Cartella importata. Scarica copia esporta le modifiche.' : '');
  files = found;
  folderHandles = folders;
  expandedFolders.clear();
  search.value = '';
  $('rootName').textContent = name;
  if (text === null) {
    resetDoc('', '');
    if (path) toast('Impossibile aprire «' + path + '».');
  } else {
    resetDoc(text, path, handle);
  }
  return true;
}

async function restoreFolder() {
  if (!window.showDirectoryPicker) return;
  const revision = folderRevision;
  const canSwitch = () => revision === folderRevision && !hasWorkspaceFolder() && !current;
  try {
    const record = await folderPreference();
    const handle = record?.handle || record;
    if (!canSwitch() || handle?.kind !== 'directory') return;
    rememberedFolder = handle;
    rememberedPaths = Array.isArray(record.paths) ? record.paths.filter(path => typeof path === 'string' && isMD(path)) : [];
    folderAccessPending = true;
    $('rootName').textContent = handle.name;
    renderPath();
    renderWorkStart();
    renderTree();
    mark(false);
    if (await handle.queryPermission(readAccess) === 'granted' && canSwitch()) {
      if (await showFolder(handle, canSwitch)) await rememberFolderIndex();
    }
  } catch {
    // The last confirmed list remains available if the folder cannot be read at startup.
  }
}

async function chooseFolder(reopen = false, requestedPath = '') {
  if (fileActionBusy || folderOpening || documentOpening || loading) return;
  if (!window.showDirectoryPicker) {
    if (canImportFolder) pickImportedFolder();
    else toast('Per aprire cartelle usa Chrome o Edge su computer.');
    return;
  }
  folderOpening = true;
  updateHistoryButtons();
  const revision = ++folderRevision;
  const controls = [$('openDir'), $('importFolder'), $('startAction'), $('openFile'), $('newDoc'), $('refresh')];
  controls.forEach(button => { button.disabled = true; });
  let enteredFolder = false;
  try {
    if (!await guard()) return;
    const editAtStart = editRevision;
    let handle;
    if (reopen) {
      handle = rememberedFolder;
      if (!handle || await handle.requestPermission(readAccess) !== 'granted') {
        offerFolderImport('Accesso alla cartella non concesso.');
        return;
      }
    } else {
      handle = await showDirectoryPicker({ id: 'quaderno-cartella', ...readAccess });
    }
    enteredFolder = true;
    if (!await showFolder(handle, () => revision === folderRevision && editAtStart === editRevision, requestedPath)) {
      if (revision === folderRevision) toast('Cartella non cambiata: il documento è stato modificato durante il caricamento.');
      return;
    }
    if (reopen && current) ed.focus({ preventScroll: true });
    try {
      await rememberFolderIndex();
    } catch {
      if (!reopen) toast('Cartella aperta. Il browser non può ricordarla per il prossimo avvio.');
    }
  } catch (error) {
    let message = 'Il browser non ha concesso la lettura della cartella.';
    if (enteredFolder) message = 'Errore durante la lettura della cartella (' + error.name + '): ' + error.message;
    else if (error.name !== 'AbortError') message = 'Selettore della cartella (' + error.name + '): ' + error.message;
    offerFolderImport(message);
  } finally {
    folderOpening = false;
    updateHistoryButtons();
    controls.forEach(button => { button.disabled = false; });
    $('refresh').disabled = !hasWorkspaceFolder();
  }
}

function pickImportedFolder() {
  if (!canImportFolder || fileActionBusy || folderOpening || documentOpening || loading || $('dialog').open) return;
  folderRevision++;
  folderInput.value = '';
  folderInput.click();
}

folderInput.onchange = async () => {
  const selection = [...folderInput.files];
  folderInput.value = '';
  if (fileActionBusy || folderOpening || documentOpening || loading || $('dialog').open) return;
  if (!selection.length) {
    toast('La cartella selezionata è vuota o il browser non ha restituito file.');
    return;
  }
  folderOpening = true;
  updateHistoryButtons();
  const revision = ++folderRevision;
  try {
    if (!await guard()) return;
    const editAtStart = editRevision;
    const name = selection[0].webkitRelativePath.split('/')[0];
    const found = new Map();
    const folders = new Map();
    for (const file of selection) {
      const [base, ...parts] = file.webkitRelativePath.split('/');
      if (base !== name || !parts.length || parts.some(part => !part || part.startsWith('.') || part === 'node_modules')) continue;
      const path = parts.join('/');
      if (!isMD(path) && !isImage(path)) continue;
      found.set(path, { getFile: async () => file });
      for (let folder = parent(path); folder && !folders.has(folder); folder = parent(folder)) folders.set(folder, null);
    }
    if (![...found.keys()].some(isMD)) {
      toast('Nessun file .md o .markdown trovato nella cartella selezionata.');
      return;
    }
    const previous = importedFolderName === name && found.has(current) ? current : '';
    const canSwitch = () => revision === folderRevision && editAtStart === editRevision;
    if (!await showFolderIndex(name, { found, folders }, canSwitch, previous)) {
      toast('Cartella non cambiata: il documento è stato modificato durante il caricamento.');
    }
  } catch (error) {
    toast('Impossibile importare la cartella: ' + error.message);
  } finally {
    folderOpening = false;
    updateHistoryButtons();
  }
};

$('openDir').onclick = () => chooseFolder();
$('importFolder').onclick = pickImportedFolder;

const fileMenu = $('fileMenu');
let menuTrigger = null;
let menuItem = null;
let fileActionBusy = false;

function closeFileMenu() {
  if (fileMenu.matches(':popover-open')) fileMenu.hidePopover();
  menuTrigger?.setAttribute('aria-expanded', 'false');
  menuTrigger = null;
  menuItem = null;
}

function showFileMenu(item, trigger) {
  if (fileActionBusy || loading || documentOpening || folderOpening) return;
  const alreadyOpen = menuTrigger === trigger && fileMenu.matches(':popover-open');
  closeFileMenu();
  if (alreadyOpen) return;

  menuItem = item;
  fileMenu.setAttribute('aria-label', item.isFolder ? 'Azioni cartella' : 'Azioni file');
  menuTrigger = trigger;
  trigger.setAttribute('aria-expanded', 'true');
  fileMenu.showPopover();
  const button = trigger.getBoundingClientRect();
  const gap = 5;
  const menuWidth = fileMenu.offsetWidth;
  const menuHeight = fileMenu.offsetHeight;
  const top = button.bottom + gap + menuHeight > innerHeight ? button.top - gap - menuHeight : button.bottom + gap;
  fileMenu.style.top = Math.max(gap, top) + 'px';
  fileMenu.style.left = Math.max(gap, Math.min(button.right - menuWidth, innerWidth - menuWidth - gap)) + 'px';
  fileMenu.querySelector('button').focus({ preventScroll: true });
}

fileMenu.addEventListener('toggle', () => {
  if (!fileMenu.matches(':popover-open')) {
    closeFileMenu();
    if (search.value.trim()) queueSearchRender();
  }
});
$('tree').addEventListener('scroll', closeFileMenu);
window.addEventListener('resize', closeFileMenu);
for (const button of fileMenu.querySelectorAll('[data-file-action]')) {
  button.onclick = () => {
    const item = menuItem;
    const trigger = menuTrigger;
    closeFileMenu();
    trigger?.focus({ preventScroll: true });
    if (item) manageEntry(item, button.dataset.fileAction);
  };
}

function inFolder(path, folder) {
  return path === folder || path.startsWith(folder + '/');
}

function targetFolders(path, isFolder) {
  return [...folderHandles.keys()].filter(folder =>
    folder !== parent(path) && (!isFolder || !inFolder(folder, path)));
}

async function askFileAction(path, action, isFolder) {
  const kind = isFolder ? 'cartella' : 'documento';
  const name = path.split('/').pop();
  if (action === 'rename') {
    const label = isFolder ? 'Nome della cartella' : 'Nome del file';
    return modal('Rinomina ' + kind,
      '<label>' + label + '</label><input name="name" required value="' + escapeHtml(name) + '">',
      'Rinomina');
  }
  if (action === 'move') {
    const folders = targetFolders(path, isFolder);
    if (!folders.length) {
      toast('Non ci sono altre cartelle di destinazione.');
      return null;
    }
    folders.sort((a, b) => a.localeCompare(b, 'it', { numeric: true }));
    const options = folders.map(folder => '<option value="' + escapeHtml(folder) + '">' +
      escapeHtml(folder || root.name + ' (cartella di lavoro)') + '</option>').join('');
    return modal('Sposta ' + kind,
      '<p>' + escapeHtml(path) + '</p><label>Cartella di destinazione</label><select name="folder">' + options + '</select>' +
      '<p>I link con percorsi relativi potrebbero richiedere un aggiornamento.</p>', 'Sposta');
  }
  const includesCurrent = isFolder ? inFolder(current, path) : current === path;
  const changes = includesCurrent && dirty ? ' Le modifiche non salvate andranno perse.' : '';
  const message = isFolder ? '» e tutto il suo contenuto saranno eliminati definitivamente dal disco.' :
    '» sarà eliminato definitivamente dal disco.';
  const proceed = await modal('Elimina ' + kind, '<p>«' + escapeHtml(path) + message + changes + '</p>', 'Continua', true);
  if (!proceed) return null;

  return modal('Conferma eliminazione', '<p>Per eliminare «' + escapeHtml(path) + '», digita esattamente <strong>' +
    escapeHtml(name) + '</strong>.</p><label>Nome esatto</label>' +
    '<input name="confirmation" type="text" required autocomplete="off" autocapitalize="off" spellcheck="false">',
    'Elimina definitivamente', true, name);
}

async function manageEntry({ path, isFolder }, action) {
  const entries = isFolder ? folderHandles : files;
  const handle = entries.get(path);
  const sourceFolder = folderHandles.get(parent(path || ''));
  const directory = root;
  if (!directory || !handle || !sourceFolder || fileActionBusy || documentOpening || folderOpening || loading || $('dialog').open) return;
  const answer = await askFileAction(path, action, isFolder);
  if (!answer || directory !== root || entries !== (isFolder ? folderHandles : files) || entries.get(path) !== handle ||
      loading || fileActionBusy || documentOpening || folderOpening) return;

  const name = path.split('/').pop();
  let destinationPath;
  if (action === 'rename') {
    const enteredName = answer.name.trim();
    if (!enteredName || enteredName.startsWith('.') || enteredName.endsWith('.') || /[\\/:*?"<>|\u0000-\u001f]/.test(enteredName)) {
      toast(isFolder ? 'Inserisci un nome di cartella valido.' : 'Inserisci un nome di file valido.');
      return;
    }
    const newName = isFolder || isMD(enteredName) ? enteredName : enteredName + name.match(/\.(md|markdown)$/i)[0];
    destinationPath = [parent(path), newName].filter(Boolean).join('/');
    if (destinationPath === path) return;
  } else if (action === 'move') {
    if (!targetFolders(path, isFolder).includes(answer.folder)) {
      toast('La cartella di destinazione non è disponibile.');
      return;
    }
    destinationPath = [answer.folder, name].filter(Boolean).join('/');
  }

  fileActionBusy = true;
  updateHistoryButtons();
  folderRevision++;
  workspace.inert = true;
  closeLinkPreview();
  try {
    if (!await allowFolderWrite(directory)) return;
    if (action === 'delete') {
      const latest = isFolder ? await sourceFolder.getDirectoryHandle(name) : await sourceFolder.getFileHandle(name);
      if (!await handle.isSameEntry(latest)) throw new Error('L’elemento è cambiato. Apri di nuovo il menu per riprovare.');
      await sourceFolder.removeEntry(name, { recursive: isFolder });
      if (isFolder) {
        removeFolderFromIndex(path);
        if (inFolder(current, path)) await selectAfterDeletion();
        else refreshDocumentImages();
      } else {
        files.delete(path);
        invalidateSearchPath(path);
        if (current === path) await selectAfterDeletion();
      }
      removeMissingHistory();
      renderTree();
      toast(isFolder ? 'Cartella eliminata' : 'Documento eliminato');
    } else if (isFolder) {
      await relocateFolder(path, destinationPath);
      toast(action === 'rename' ? 'Cartella rinominata' : 'Cartella spostata');
    } else {
      await relocateFile(path, destinationPath);
      toast(action === 'rename' ? 'Documento rinominato' : 'Documento spostato');
    }
    if (!current) renderWorkStart();
    await rememberFolderIndex().catch(() => {});
  } catch (error) {
    try { await scan(); } catch {}
    toast(error.message);
  } finally {
    workspace.inert = false;
    fileActionBusy = false;
    updateHistoryButtons();
  }
}

function removeFolderFromIndex(path) {
  for (const file of files.keys()) if (inFolder(file, path)) files.delete(file);
  for (const folder of folderHandles.keys()) if (inFolder(folder, path)) folderHandles.delete(folder);
  for (const folder of expandedFolders) if (inFolder(folder, path)) expandedFolders.delete(folder);
  resetSearchIndex();
}

async function selectAfterDeletion() {
  const paths = [...files.keys()].filter(isMD).sort((a, b) => a.localeCompare(b, 'it', { numeric: true }));
  const next = paths.find(path => parent(path) === parent(current)) || paths[0];
  const handle = files.get(next);
  if (handle) {
    try {
      resetDoc(await (await handle.getFile()).text(), next, handle);
      return;
    } catch {}
  }
  resetDoc('', '');
}

async function existingFile(folder, name) {
  try {
    return await folder.getFileHandle(name);
  } catch (error) {
    if (error.name === 'NotFoundError') return null;
    if (error.name === 'TypeMismatchError') throw new Error('Esiste già una cartella con il nome «' + name + '».');
    throw error;
  }
}

async function entryDirectory(folder, name) {
  try {
    return await folder.getDirectoryHandle(name);
  } catch (error) {
    if (error.name === 'NotFoundError') return null;
    if (error.name === 'TypeMismatchError') throw new Error('Esiste già un file con il nome «' + name + '».');
    throw error;
  }
}

async function newEmptyFolder(parentFolder, name) {
  if (await entryDirectory(parentFolder, name)) throw new Error('Esiste già una cartella con il nome «' + name + '».');
  const directory = await parentFolder.getDirectoryHandle(name, { create: true });
  for await (const _ of directory.entries()) {
    throw new Error('La cartella di destinazione contiene già dei dati.');
  }
  return directory;
}

async function copyDirectoryEntries(source, target) {
  const entries = new Map();
  for await (const [name, handle] of source.entries()) {
    if (handle.kind === 'directory') {
      const directory = await newEmptyFolder(target, name);
      entries.set(name, { source: handle, target: directory, contents: await copyDirectoryEntries(handle, directory) });
      continue;
    }
    const snapshot = await handle.getFile();
    if (await existingFile(target, name)) throw new Error('Esiste già un file con il nome «' + name + '».');
    const copy = await target.getFileHandle(name, { create: true });
    if ((await copy.getFile()).size) throw new Error('Esiste già un file con il nome «' + name + '».');
    const writer = await copy.createWritable({ mode: 'exclusive' });
    try {
      await writer.write(snapshot);
      await writer.close();
    } catch (error) {
      try { await writer.abort(); } catch {}
      throw error;
    }
    const copied = await copy.getFile();
    if (copied.size !== snapshot.size) throw new Error('Dimensione della copia non valida per «' + name + '».');
    entries.set(name, { source: handle, target: copy, sourceFile: snapshot, targetFile: copied });
  }
  return entries;
}

async function verifyDirectoryEntries(directory, entries, side) {
  let count = 0;
  for await (const [name, handle] of directory.entries()) {
    const entry = entries.get(name);
    if (!entry || handle.kind !== entry[side].kind || !await handle.isSameEntry(entry[side])) return false;
    if (handle.kind === 'directory') {
      if (!await verifyDirectoryEntries(handle, entry.contents, side)) return false;
    } else {
      const file = await handle.getFile();
      const written = side === 'source' ? entry.sourceFile : entry.targetFile;
      if (file.size !== written.size || file.lastModified !== written.lastModified) return false;
    }
    count++;
  }
  return count === entries.size;
}

async function relocateFolder(from, to) {
  if (inFolder(to, from)) throw new Error('Scegli una destinazione fuori dalla cartella da spostare.');
  const source = folderHandles.get(from);
  const target = folderHandles.get(parent(to));
  if (!source || !target) throw new Error('La cartella non è più disponibile.');
  const name = to.split('/').pop();
  const existing = await entryDirectory(target, name);
  if (!existing) {
    await copyAndRemoveFolder(from, to);
    return;
  }

  const caseOnly = parent(from) === parent(to) && from.toLowerCase() === to.toLowerCase() &&
    await existing.isSameEntry(source);
  if (!caseOnly) throw new Error('Esiste già una cartella con il nome «' + name + '».');
  for await (const [entryName] of target.entries()) {
    if (entryName === name) throw new Error('Esiste già una cartella con il nome «' + name + '».');
  }

  const temporary = [parent(from), 'Recupero Itaca Lite ' + crypto.randomUUID()].filter(Boolean).join('/');
  await copyAndRemoveFolder(from, temporary);
  try {
    await copyAndRemoveFolder(temporary, to);
  } catch (error) {
    throw new Error('Cartella conservata in «' + temporary + '». ' + error.message);
  }
}

async function copyAndRemoveFolder(from, to) {
  const source = folderHandles.get(from);
  const sourceParent = folderHandles.get(parent(from));
  const targetParent = folderHandles.get(parent(to));
  const target = await newEmptyFolder(targetParent, to.split('/').pop());
  let indexed;
  let copied = false;
  try {
    const snapshot = await copyDirectoryEntries(source, target);
    indexed = await scanFolder(target);
    if (!await verifyDirectoryEntries(target, snapshot, 'target')) {
      throw new Error('La cartella di destinazione è cambiata durante la copia.');
    }
    copied = true;
    if (!await verifyDirectoryEntries(source, snapshot, 'source')) {
      throw new Error('La cartella originale è cambiata durante la copia.');
    }
    const name = from.split('/').pop();
    const latest = await entryDirectory(sourceParent, name);
    if (!latest || !await source.isSameEntry(latest)) throw new Error('La cartella originale non è più nella posizione di partenza.');
    await sourceParent.removeEntry(name, { recursive: true });
  } catch (error) {
    const status = copied ? 'Copia disponibile' : 'Copia incompleta';
    throw new Error(status + ' in «' + to + '». ' + error.message);
  }

  const remap = path => inFolder(path, from) ? to + path.slice(from.length) : path;
  const expanded = [...expandedFolders].filter(path => inFolder(path, from)).map(remap);
  removeFolderFromIndex(from);
  for (const [path, handle] of indexed.folders) folderHandles.set(path ? to + '/' + path : to, handle);
  for (const [path, handle] of indexed.found) files.set(to + '/' + path, handle);
  for (const path of expanded) expandedFolders.add(path);
  expandParentFolders(to);
  updateDocumentPaths(remap);
  refreshDocumentImages();
  renderTree();
}

function updateDocumentPaths(remap) {
  for (const visit of documentHistory) {
    const path = remap(visit.path);
    if (path === visit.path) continue;
    visit.path = path;
    visit.handle = files.get(path);
  }
  const path = remap(current);
  if (path !== current) {
    current = path;
    standalone = files.get(path);
    mark(dirty);
    renderPath();
  }
}

function refreshDocumentImages() {
  version++;
  revoke();
  for (const image of ed.querySelectorAll('img[data-src]')) {
    image.removeAttribute('src');
    image.classList.remove('missing');
    image.title = image.alt;
  }
  loadImages();
}

async function relocateFile(from, to) {
  const targetFolder = folderHandles.get(parent(to));
  if (!targetFolder) throw new Error('La cartella di destinazione non è disponibile.');
  const name = to.split('/').pop();
  const existing = await existingFile(targetFolder, name);
  if (existing) {
    const caseOnly = parent(from) === parent(to) && from.toLowerCase() === to.toLowerCase();
    let conflictingName = !caseOnly;
    if (caseOnly) {
      // Directory iteration returns the stored spelling, even when lookup is case insensitive.
      for await (const [entryName] of targetFolder.entries()) {
        if (entryName === name) {
          conflictingName = true;
          break;
        }
      }
    }
    if (conflictingName) throw new Error('Esiste già un documento con il nome «' + name + '» nella cartella di destinazione.');

    // A case-only rename on a case-insensitive disk needs an intermediate name.
    const temporary = [parent(from), 'Recupero Itaca Lite ' + crypto.randomUUID() + '.md'].filter(Boolean).join('/');
    await copyThenRemove(from, temporary);
    try {
      await copyThenRemove(temporary, to);
    } catch (error) {
      throw new Error('File conservato in «' + temporary + '». ' + error.message);
    }
    return;
  }
  await copyThenRemove(from, to);
}

async function copyThenRemove(from, to) {
  const sourceHandle = files.get(from);
  const source = await sourceHandle.getFile();
  const targetFolder = folderHandles.get(parent(to));
  const name = to.split('/').pop();
  if (await existingFile(targetFolder, name)) throw new Error('Il documento di destinazione esiste già.');
  const targetHandle = await targetFolder.getFileHandle(name, { create: true });
  const freshTarget = await targetHandle.getFile();
  if (freshTarget.size) throw new Error('Il documento di destinazione esiste già.');

  let writer;
  try {
    writer = await targetHandle.createWritable({ mode: 'exclusive' });
    await writer.write(source);
    await writer.close();
  } catch (error) {
    try { await writer?.abort(); } catch {}
    try {
      const left = await targetHandle.getFile();
      if (!left.size && left.lastModified === freshTarget.lastModified) await targetFolder.removeEntry(name);
    } catch {}
    throw error;
  }

  files.set(to, targetHandle);
  try {
    const latest = await sourceHandle.getFile();
    if (latest.size !== source.size || latest.lastModified !== source.lastModified) {
      throw new Error('Il documento originale è stato modificato durante l’operazione.');
    }
    const sourceFolder = folderHandles.get(parent(from));
    await sourceFolder.removeEntry(from.split('/').pop());
  } catch (error) {
    throw new Error('Copia salvata in «' + to + '». ' + error.message);
  }

  files.delete(from);
  invalidateSearchPath(from);
  invalidateSearchPath(to);
  const movedCurrent = current === from;
  updateDocumentPaths(path => path === from ? to : path);
  if (movedCurrent) refreshDocumentImages();
  expandParentFolders(to);
  renderTree();
}

resetDoc('', '');
restoreDraft().then(restored => {
  if (!restored) restoreFolder();
}).catch(() => restoreFolder());
</script>
