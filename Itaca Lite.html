  <style>
:root {
  color-scheme: light;
  --ink: #1b2e46;
  --copy: #30465f;
  --muted: #526780;
  --accent: #205d99;
  --on-accent: #fff;
  --accent-hover: #184b80;
  --accent-text: #174a7a;
  --focus: #3478b7;
  --tint: #deefff;
  --tint-hover: #cce6fb;
  --sidebar: #eef5fb;
  --canvas: #f3f7fc;
  --paper: #fff;
  --punch-rim: #cbd8e5;
  --edit-green: #248449;
  --panel: #fbfdff;
  --line: #d7e4f0;
  --line-soft: #e3edf6;
  --hover: #e6f0f9;
  --scrollbar: #c8d9e9;
  --quote: #8db9de;
  --warning: #735013;
  --warning-bg: #fcf6e8;
  --warning-line: #ecdfbe;
  --dirty: #a66920;
  --danger: #ae2039;
  --danger-hover: #8d1b30;
  --danger-text: #a1223b;
  --overlay: #142b465e;
  --floating-shadow: 0 2px 7px #19365417, 0 12px 32px #19365422;
  --sans: Inter, 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', Consolas, monospace;
  font: 14px/1.45 var(--sans);
  color: var(--ink);
  background: var(--canvas);
}

:root[data-theme='dark'] {
  color-scheme: dark;
  --ink: #edf4fd;
  --copy: #d4dfec;
  --muted: #a9bad0;
  --accent: #9dcefa;
  --on-accent: #102943;
  --accent-hover: #c1e1ff;
  --accent-text: #b8dbff;
  --focus: #91c9fa;
  --tint: #213956;
  --tint-hover: #29486c;
  --sidebar: #142131;
  --canvas: #101a28;
  --paper: #19283a;
  --punch-rim: #3a536c;
  --edit-green: #34c759;
  --panel: #1b2b3f;
  --line: #354b64;
  --line-soft: #2d4259;
  --hover: #253a54;
  --scrollbar: #526b86;
  --quote: #719cc4;
  --warning: #ffda99;
  --warning-bg: #352816;
  --warning-line: #715832;
  --dirty: #eeb66b;
  --danger: #ad2944;
  --danger-hover: #c43754;
  --danger-text: #ffadc0;
  --overlay: #050b14b0;
  --floating-shadow: 0 2px 8px #070e17a0, 0 12px 30px #060d1670;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, summary { cursor: pointer; }
button { border: 0; border-radius: 7px; background: transparent; padding: 7px 10px; }
button:hover:not(:disabled), summary:hover { background-color: var(--hover); }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--tint-hover); color: var(--ink); }

.icon {
  display: inline-block;
  width: 17px;
  height: 17px;
  flex: 0 0 auto;
  background: currentColor;
  mask: var(--icon) center / contain no-repeat;
}

.icon-button { display: inline-grid; place-items: center; flex: 0 0 auto; width: 34px; height: 34px; padding: 0; color: var(--muted); }
.primary { background-color: var(--accent); color: var(--on-accent); font-weight: 650; }
.primary:hover:not(:disabled) { background-color: var(--accent-hover); }
.outline { border: 1px solid var(--line); background-color: var(--panel); }

.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
.sidebar {
  width: 264px;
  flex: 0 0 auto;
  padding: 22px 17px 16px;
  display: flex;
  flex-direction: column;
  background: var(--sidebar);
  border-right: 1px solid var(--line);
  overflow: auto;
}
.brand { display: flex; align-items: center; gap: 12px; margin: 0 2px 25px; }
.brandmark { display: grid; place-items: center; flex: none; width: 42px; height: 42px; border: 1px solid #d9d7c6; border-radius: 11px; background: #f5f1e5; }
.brandmark img { width: 40px; height: 40px; }
.brand strong { display: block; font-size: 19px; font-weight: 740; line-height: 1.15; letter-spacing: -.65px; }
.brand small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
.close-sidebar { display: none; margin-left: auto; }

.file-actions { display: grid; gap: 7px; margin-bottom: 23px; }
.file-actions button { display: flex; justify-content: center; align-items: center; gap: 7px; white-space: nowrap; font-size: 12px; font-weight: 620; }
.file-actions .new-doc { min-height: 39px; font-size: 13px; color: var(--accent-text); background: var(--tint); border: 1px solid var(--line); }
.file-actions .new-doc:hover { background: var(--tint-hover); }
.open-actions { display: grid; grid-template-columns: 1.18fr 1fr; gap: 7px; }
.open-actions button { min-height: 35px; padding: 5px; }
.open-actions .icon, .import-folder .icon { width: 15px; height: 15px; }
.file-actions .import-folder { min-height: 34px; }
.folder-access-note { margin: 0 2px; color: var(--muted); font-size: 11px; }

.search-box { position: relative; display: flex; align-items: center; margin-bottom: 20px; color: var(--muted); }
.search-box .icon { position: absolute; left: 10px; width: 15px; height: 15px; pointer-events: none; }
.search-box input { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 48px 0 32px; background: var(--paper); font-size: 12px; }
.search-box input::placeholder { color: var(--muted); opacity: 1; }
.search-box kbd { position: absolute; right: 8px; padding: 1px 4px; border: 1px solid var(--line-soft); border-radius: 4px; background: var(--canvas); font: 10px var(--sans); pointer-events: none; }
.search-box input:focus, .search-box input:not(:placeholder-shown) { padding-right: 9px; }
.search-box input:focus + kbd, .search-box input:not(:placeholder-shown) + kbd { display: none; }

.files { display: flex; flex-direction: column; flex: 1; min-height: 85px; }
.nav-heading { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 0 2px 5px 8px; }
.nav-heading h2 { margin: 0; font-size: 11px; font-weight: 720; text-transform: uppercase; letter-spacing: .085em; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-heading button { height: 26px; width: 26px; }
.nav-heading .icon { width: 15px; height: 15px; }
.tree { flex: 1; overflow: auto; padding: 2px; scrollbar-width: thin; }
.tree-row { position: relative; display: flex; width: 100%; min-height: 33px; align-items: center; gap: 7px; padding: 5px 7px 5px var(--indent, 8px); text-align: left; color: var(--copy); }
.tree-row .icon { width: 15px; height: 15px; }
.tree-row .i-chevron { width: 11px; height: 11px; }
.tree-row[aria-expanded='true'] .i-chevron { transform: rotate(90deg); }
.tree-row .row-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.tree-row.folder { font-weight: 640; }
.tree-row.current { color: var(--accent-text); background: var(--tint); font-weight: 690; }
.tree-row.current:hover { background: var(--tint-hover); }
.tree-row.current::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--focus); }
.search-status { margin: 0 8px 5px; font-size: 11px; color: var(--muted); }
.search-result { align-items: flex-start; padding-block: 7px; }
.search-result > .icon { margin-top: 1px; }
.search-result .row-label { display: grid; gap: 2px; flex: 1; }
.result-name, .result-parent { overflow: hidden; text-overflow: ellipsis; }
.result-parent, .result-snippet { color: var(--muted); font-size: 11px; font-weight: 450; }
.result-snippet { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; white-space: normal; overflow-wrap: anywhere; overflow: hidden; }
.search-result mark { background: var(--warning-bg); color: var(--warning); border-radius: 2px; font-weight: 680; }
.search-more { display: block; margin: 4px auto; color: var(--accent-text); font-size: 12px; }
.tree-file { display: flex; align-items: stretch; border-radius: 7px; }
.tree-file:has(.current) { background: var(--tint); }
.tree-file > .tree-row { flex: 1; min-width: 0; width: auto; }
.tree-file > .file-actions-button { width: 27px; height: auto; margin: 3px; border-radius: 5px; }
.i-more { background: radial-gradient(circle, currentColor 1.15px, transparent 1.5px) left center / 33.333% 100% repeat-x; mask: none; width: 15px; }
.file-menu { position: fixed; inset: auto; width: 150px; margin: 0; padding: 5px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--floating-shadow); }
.file-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; text-align: left; font-size: 13px; }
.file-menu button .icon { width: 15px; height: 15px; }
.link-preview { position: fixed; z-index: 7; display: flex; flex-direction: column; width: min(440px, calc(100vw - 20px)); max-height: min(410px, calc(100dvh - 20px)); overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: var(--floating-shadow); }
.link-preview-header { display: flex; flex: none; align-items: center; gap: 9px; padding: 8px 11px; border-bottom: 1px solid var(--line); background: var(--panel); }
.link-preview-header > .icon { color: var(--muted); }
.link-preview-label { flex: 1; min-width: 0; }
.link-preview-label > * { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-preview-label strong { color: var(--ink); font-size: 13px; }
.link-preview-label small { color: var(--muted); font-size: 11px; }
.link-preview-header button { padding: 4px 9px; font-size: 12px; }
.link-preview .link-preview-body { min-height: 0; padding: 14px 16px; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; font-size: 13px; line-height: 1.6; }
.link-preview-body h1 { font-size: 1.6em; }
.link-preview-body h2 { font-size: 1.3em; }
.link-preview-body pre { max-height: 160px; padding: 8px; overflow: auto; font-size: 12px; }
.link-preview-body > img { display: block; margin-inline: auto; }
.link-preview-body img { max-height: 230px; object-fit: contain; }
.link-preview-body [data-preview-heading] { border-radius: 3px; background: var(--tint); }
.link-preview-body :focus-visible { outline: 2px solid var(--focus); }
.danger-text { color: var(--danger-text); }
.primary.danger { background: var(--danger); color: #fff; }
.primary.danger:hover { background: var(--danger-hover); }
.empty-tree { margin: 8px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

.outline-nav { margin-top: 17px; padding-top: 10px; border-top: 1px solid var(--line); }
.outline-nav summary { display: flex; align-items: center; gap: 7px; padding: 7px 7px; border-radius: 7px; font-size: 12px; font-weight: 670; list-style: none; }
.outline-nav summary::-webkit-details-marker { display: none; }
.outline-nav summary .i-index { color: var(--muted); width: 16px; height: 16px; }

<body>
  <div class="app" id="app">
    <button type="button" class="backdrop" id="backdrop" tabindex="-1" aria-label="Chiudi navigazione" hidden></button>
    <aside class="sidebar" id="sidebar" aria-label="Navigazione documenti">
      <header class="brand">
        <span class="brandmark"><img id="brandIcon" alt="" width="40" height="40"></span>
        <span><strong>Itaca Lite</strong><small>Editor Markdown</small></span>
        <button type="button" class="icon-button close-sidebar" id="closeSidebar" aria-label="Chiudi navigazione" title="Chiudi navigazione"><i class="icon i-close" aria-hidden="true"></i></button>
      </header>
      <div class="file-actions">
        <button type="button" class="new-doc" id="newDoc"><i class="icon i-plus" aria-hidden="true"></i>Nuovo documento</button>
        <div class="open-actions">
          <button type="button" class="outline" id="openDir"><i class="icon i-folder-open" aria-hidden="true"></i>Apri cartella</button>
          <button type="button" class="outline" id="openFile"><i class="icon i-file" aria-hidden="true"></i>Apri file</button>
        </div>
        <button type="button" class="outline import-folder" id="importFolder"><i class="icon i-folder-open" aria-hidden="true"></i>Importa cartella</button>
        <p class="folder-access-note" id="folderAccessNote" role="status" hidden></p>
      </div>
      <div class="search-box">
        <i class="icon i-search" aria-hidden="true"></i>
        <input type="search" id="search" placeholder="Cerca nei documenti…" aria-label="Cerca nei nomi e nel testo dei documenti" aria-keyshortcuts="Control+K Meta+K">
        <kbd id="searchKey" aria-hidden="true">Ctrl K</kbd>
      </div>
      <nav class="files" aria-labelledby="rootName">
        <div class="nav-heading">
          <h2 id="rootName">Documenti</h2>
          <button type="button" class="icon-button" id="refresh" aria-label="Aggiorna cartella" title="Aggiorna cartella"><i class="icon i-refresh" aria-hidden="true"></i></button>
        </div>
        <p class="search-status" id="searchStatus" role="status" hidden></p>
        <div class="tree" id="tree"></div>
      </nav>
      <details class="outline-nav" id="outlineNav" open hidden>
        <summary><i class="icon i-index" aria-hidden="true"></i><span>Indice del documento</span><i class="icon i-chevron" aria-hidden="true"></i></summary>
        <nav id="outlineList" aria-label="Titoli del documento"></nav>
      </details>
    </aside>

    <main class="main" id="main">
      <div class="document-area">
        <div class="workspace" id="workspace">
          <section class="work-start" id="workStart" aria-labelledby="startTitle">
            <i class="icon i-folder-open" aria-hidden="true"></i>
            <h1 id="startTitle">Cartella di lavoro</h1>
            <p id="startDescription"></p>
            <button type="button" class="primary" id="startAction">Scegli cartella</button>
          </section>
          <article id="editor" class="editor paper" contenteditable="false" spellcheck="false" role="document" aria-label="Documento Markdown" hidden></article>
          <div class="source-paper paper" id="sourcePaper" hidden>
            <textarea class="source" id="source" spellcheck="false" aria-label="Sorgente Markdown" readonly></textarea>
          </div>
        </div>
        <div class="document-actions" id="documentActions" role="group" aria-label="Comandi del documento" hidden>
          <div class="view-switch" id="viewSwitch" role="group" aria-label="Modalità del documento" hidden>
            <button type="button" id="visualMode" aria-label="Visuale" aria-pressed="true" title="Editor visuale"><i class="icon i-edit" aria-hidden="true"></i><span>Visuale</span></button>
            <button type="button" id="sourceToggle" aria-label="Markdown" aria-pressed="false" title="Sorgente Markdown"><i class="icon i-code" aria-hidden="true"></i><span>Markdown</span></button>
          </div>
          <button type="button" class="edit-switch" id="editToggle" role="switch" aria-checked="false" title="Abilita modifica"><span class="edit-switch-track" aria-hidden="true"></span>Modifica</button>
          <button type="button" class="save" id="exportPdf" aria-label="Esporta PDF" title="Esporta PDF" aria-haspopup="dialog">PDF</button>
          <button type="button" class="primary save" id="save" aria-label="Salva" title="Salva (Ctrl/⌘ + S)" disabled><i class="icon i-save" aria-hidden="true"></i><span>Salva</span></button>
        </div>
        <div class="image-resize" id="imageResize" hidden>
          <span id="imageSize" class="image-size" aria-hidden="true"></span>
          <button type="button" id="imageGrip" class="image-grip" role="slider" aria-label="Larghezza dell’immagine" title="Trascina o usa le frecce per ridimensionare">↘</button>
        </div>
        <div class="dock">
          <div class="toolbar" id="toolbar" role="group" aria-label="Formattazione del documento" hidden>
            <div class="tools" role="group" aria-label="Stile del testo">
              <select id="heading" title="Stile del paragrafo" aria-label="Stile del paragrafo">
                <option value="p">Paragrafo</option>
                <option value="h1">Titolo 1</option>
                <option value="h2">Titolo 2</option>
                <option value="h3">Titolo 3</option>
                <option value="h4">Titolo 4</option>
                <option value="h5">Titolo 5</option>
                <option value="h6">Titolo 6</option>
                <option value="blockquote">Citazione</option>
                <option value="pre">Blocco di codice</option>
                <option value="code" disabled hidden>Codice in linea</option>

function rtfClipboardImages(rtf) {
  const images = [];
  for (const [, picture] of rtf.matchAll(/\{\\pict\b((?:[^{}]|\{[^{}]*\})*)\}/gi)) {
    const direct = picture.replace(/\{[^{}]*\}/g, '');
    const format = /\\(png|jpeg)blip\b/i.exec(direct)?.[1].toLowerCase();
    if (!format) continue;
    const payload = /(?:\s|^)((?:89504e470d0a1a0a|ffd8ff)[a-f\d\s]*)$/i.exec(direct)?.[1].replace(/\s/g, '');
    if (!payload?.toLowerCase().startsWith(format === 'png' ? '89504e470d0a1a0a' : 'ffd8ff') || payload.length % 2) continue;
    const bytes = new Uint8Array(payload.length / 2);
    for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(payload.slice(i * 2, i * 2 + 2), 16);
    images.push(new File([bytes], 'Immagine.' + format, { type: 'image/' + format }));
  }
  return images;
}

function imageAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const extension = file.name.split('.').pop().toLowerCase();
      const type = imageType.test(file.type) ? file.type : 'image/' + ({ jpg: 'jpeg', ico: 'x-icon' }[extension] || extension);
      const url = 'data:' + type + reader.result.slice(reader.result.indexOf(';base64,'));
      if (embeddedImage.test(url)) resolve(url);
      else reject(new Error('Formato immagine non supportato'));
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function historyIndex(step) {

}

$('historyForward').onclick = () => navigateHistory(1);

let searchIndex = { entries: new Map(), queue: [], active: 0 };
let currentSearchEntry;
let searchRenderTimer;
let searchLimit = 80;
let resetSearchScroll = false;
const searchStatus = $('searchStatus');

function foldSearch(text) {
  return text.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
}

function searchTerms(query) {
  return [...new Set([...query.matchAll(/"([^"]+)"|[^"\s]+/g)]
    .map(match => foldSearch((match[1] || match[0]).trim().replace(/\s+/g, ' ')))
    .filter(Boolean))];
}

function searchTextParts(container) {
  const chunks = [];
  let offset = 0;
  function add(text, node = null) {
    if (!text) return;
    chunks.push({ text, node, offset });
    offset += text.length;
  }
  function collect(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      add(node.data, node);
      return;
    }
    if (node.nodeType === Node.ELEMENT_NODE && node.hasAttribute('data-code-chrome')) return;
    const tag = node.tagName;
    if (tag === 'IMG') {
      add(' ');
      add(node.alt, node);
      add(' ');
      return;
    }
    const separate = /^(?:P|DIV|BR|H[1-6]|LI|BLOCKQUOTE|PRE|TD|TH|HR)$/.test(tag);
    if (separate) add(' ');
    for (const child of node.childNodes) collect(child);
    if (separate) add(' ');
  }
  collect(container);
  return chunks;
}

function normalizedSearchText(text) {
  return text.replaceAll(caretBoundary, '').replace(/\s+/g, ' ').trim().normalize('NFC');
}

function indexMarkdown(markdown) {
  const [metadata, body] = frontSplit(markdown);
  const content = sanitize(parseDocumentMarkdown(body));
  const parts = searchTextParts(content).map(chunk => chunk.text);
  if (metadata) parts.push(' ', metadata.trimEnd().split(/\r?\n/).slice(1, -1).join(' '));
  const text = normalizedSearchText(parts.join(''));
  return { text, folded: foldSearch(text) };
}

let searchImage = null;
let sourceSearchSelection = null;
function clearSearchLocation() {
  CSS.highlights?.delete('document-search');
  searchImage?.classList.remove('search-image-match');
  searchImage = null;
  if (sourceSearchSelection && src.selectionStart === sourceSearchSelection[0] &&
      src.selectionEnd === sourceSearchSelection[1]) src.setSelectionRange(src.selectionEnd, src.selectionEnd);
  sourceSearchSelection = null;
}

function searchRawOffsets(raw, terms) {
  const folded = foldSearch(normalizedSearchText(raw));
  let first = Infinity;
  let length = 0;
  for (const term of terms) {
    const position = folded.indexOf(term);
    if (position >= 0 && (position < first || position === first && term.length > length)) {
      first = position;
      length = term.length;
    }
  }
  if (!length) return null;

  // Map the accent- and whitespace-insensitive match back to the original DOM offsets.
  const end = first + length;
  let position = 0;
  let startOffset;
  let previousSpace = true;
  for (const match of raw.matchAll(/\s+|[^\s\p{M}\u200b]\p{M}*|\p{M}+|\u200b/gu)) {
    const space = /^\s/.test(match[0]);
    const size = space ? Number(!previousSpace) : foldSearch(match[0].replaceAll(caretBoundary, '')).length;
    if (!size) continue;
    previousSpace = space;
    if (startOffset === undefined && position + size > first) startOffset = match.index;
    position += size;
    if (position >= end) return [startOffset, match.index + match[0].length];
  }
  return null;
}

function revealSearchMatch(terms) {
  clearSearchLocation();
  if (sourceMode) setMode(false);
  const parts = searchTextParts(ed);
  const raw = parts.map(part => part.text).join('');
  const offsets = searchRawOffsets(raw, terms);
  if (!offsets) {
    if (!front || !searchRawOffsets(front.trimEnd().split(/\r?\n/).slice(1, -1).join('\n'), terms)) return;
    setMode(true, true);
    const location = searchRawOffsets(frontSplit(src.value)[0], terms);
    if (location) {
      src.focus({ preventScroll: true });
      src.setSelectionRange(...location);
      sourceSearchSelection = location;
      const line = src.value.slice(0, location[0]).split('\n').length - 1;
      src.scrollTop = Math.max(0, line * parseFloat(getComputedStyle(src).lineHeight) - src.clientHeight / 3);
    }
    return;
  }

  const [start, end] = offsets;
  const before = parts.find(part => part.node && part.offset <= start && start < part.offset + part.text.length);
  const after = parts.find(part => part.node && part.offset < end && end <= part.offset + part.text.length);
  if (!before || !after) return;
  const range = document.createRange();
  if (before.node.nodeType === Node.TEXT_NODE) range.setStart(before.node, start - before.offset);
  else range.setStartBefore(before.node);
  if (after.node.nodeType === Node.TEXT_NODE) range.setEnd(after.node, end - after.offset);
  else range.setEndAfter(after.node);
  if (CSS.highlights && typeof Highlight === 'function') CSS.highlights.set('document-search', new Highlight(range));
  if (before.node.tagName === 'IMG' || after.node.tagName === 'IMG') {
    searchImage = before.node.tagName === 'IMG' ? before.node : after.node;
    searchImage.classList.add('search-image-match');
  }

  const viewer = before.node.parentElement.closest('.code-scroll');
  if (viewer) {
    const bounds = viewer.getBoundingClientRect();
    const rect = range.getClientRects()[0];
    if (rect) {
      viewer.scrollTop += rect.top - bounds.top - viewer.clientHeight / 3;
      if (rect.left < bounds.left || rect.right > bounds.right) viewer.scrollLeft += rect.left - bounds.left - 12;
      const input = viewer.nextElementSibling;
      if (!input.hidden) {
        input.scrollTop = viewer.scrollTop;
        input.scrollLeft = viewer.scrollLeft;
      }
    }
  }
  const rect = range.getClientRects()[0];
  if (rect) workspace.scrollTop += rect.top - workspace.getBoundingClientRect().top - workspace.clientHeight * .4;
}

function resetSearchIndex() {
  searchIndex = { entries: new Map(), queue: [], active: 0 };
  currentSearchEntry = undefined;
  clearTimeout(searchRenderTimer);
  searchRenderTimer = undefined;
}

function invalidateSearchPath(path) {
  searchIndex.entries.delete(path);
}

function queueSearchRender() {
  if (searchRenderTimer !== undefined) return;
  searchRenderTimer = setTimeout(() => {
    searchRenderTimer = undefined;
    if (search.value.trim() && !$('fileMenu').matches(':popover-open')) renderTree();
  }, 90);
}

function pumpSearchIndex(index) {
  while (index === searchIndex && index.active < 4 && index.queue.length) {
    const path = index.queue.pop();
    const handle = files.get(path);
    if (!handle || index.entries.has(path)) continue;
    const record = { handle, content: undefined };
    index.entries.set(path, record);
    index.active++;
    (async () => {
      try {
        const file = await handle.getFile();
        const markdown = await file.text();
        if (index === searchIndex && index.entries.get(path) === record) record.content = indexMarkdown(markdown);
      } catch {
        record.content = null;
      } finally {
        index.active--;
        if (index === searchIndex) {
          queueSearchRender();
          pumpSearchIndex(index);
        }
      }
    })();
  }
}

function getSearchContent(path) {
  if (path === current && (dirty || !hasWorkspaceFolder())) {
    if (!currentSearchEntry || currentSearchEntry.version !== version ||
        currentSearchEntry.revision !== editRevision || currentSearchEntry.original !== original) {
      currentSearchEntry = { version, revision: editRevision, original, content: indexMarkdown(getMarkdown()) };
    }
    return currentSearchEntry.content;
  }
  return searchIndex.entries.get(path)?.content;
}

function searchMatches(docs, terms) {
  const index = searchIndex;
  index.queue = docs.filter(path => {
    const handle = files.get(path);
    const record = index.entries.get(path);
    if (record && record.handle !== handle) index.entries.delete(path);
    return handle && !index.entries.has(path);
  }).reverse();
  pumpSearchIndex(index);

  const matches = [];
  let pending = 0;
  let unreadable = 0;
  for (const path of docs) {
    const content = getSearchContent(path);
    if (hasWorkspaceFolder() && content === undefined) pending++;
    if (content === null) unreadable++;
    const key = foldSearch(path);
    const name = key.split('/').pop().replace(/\.(md|markdown)$/, '');
    let score = name === terms.join(' ') ? 30 : 0;
    let first = Infinity;
    let matched = true;
    for (const term of terms) {
      const position = content?.folded.indexOf(term) ?? -1;
      const inPath = key.includes(term);
      if (!inPath && position === -1) {
        matched = false;
        break;
      }
      if (name.includes(term)) score += 8;
      else if (inPath) score += 4;
      if (position !== -1) {
        score++;
        first = Math.min(first, position);
      }
    }
    if (matched) matches.push({ path, score, first, content });
  }
  matches.sort((a, b) => b.score - a.score);
  return { matches, pending, unreadable };
}

function highlightSearch(node, value, terms, start = 0, end, folded = foldSearch(value)) {
  if (end === undefined) end = folded.length;
  let positions;
  if (folded.length !== value.length) {
    positions = [0];
    for (const part of value.matchAll(/\P{M}\p{M}*|\p{M}+/gu)) {
      const count = foldSearch(part[0]).length;
      for (let i = 0; i < count; i++) positions.push(part.index + (i + 1 === count ? part[0].length : 0));
      if (positions.length > end) break;
    }
  }
  const slice = (from, to) => value.slice(positions ? positions[from] : from, positions ? positions[to] : to);
  let cursor = start;
  while (cursor < end) {
    let first = end;
    let length = 0;
    for (const term of terms) {
      const hit = folded.indexOf(term, cursor);
      if (hit < 0 || hit >= end) continue;
      if (hit < first || hit === first && term.length > length) {
        first = hit;
        length = term.length;
      }
    }
    node.append(slice(cursor, first));
    if (first === end) break;
    const mark = document.createElement('mark');
    cursor = Math.min(end, first + length);
    mark.textContent = slice(first, cursor);
    node.append(mark);
  }
}

function searchResultLabel(label, path, match, terms) {
  const name = document.createElement('span');
  name.className = 'result-name';
  highlightSearch(name, path.split('/').pop(), terms);
  label.replaceChildren(name);
  if (parent(path)) {
    const folder = document.createElement('span');
    folder.className = 'result-parent';
    highlightSearch(folder, parent(path), terms);
    label.append(folder);
  }
  if (Number.isFinite(match.first)) {
    const { text, folded } = match.content;
    const start = Math.max(0, match.first - 32);
    const end = Math.min(folded.length, start + 150);
    const snippet = document.createElement('span');
    snippet.className = 'result-snippet';
    if (start > 0) snippet.append('…');
    highlightSearch(snippet, text, terms, start, end, folded);
    if (end < folded.length) snippet.append('…');
    label.append(snippet);
  }
}

function renderTree() {
  const tree = $('tree');
  const query = search.value;
  const queryRevision = searchQueryRevision;
  const terms = searchTerms(query);
  const searching = terms.length > 0;
  const paths = new Set(folderAccessPending ? rememberedPaths : [...files.keys()].filter(isMD));
  if (!hasWorkspaceFolder() && current) paths.add(current);
  const docs = [...paths].sort((a, b) => a.localeCompare(b, 'it', { numeric: true }));
  const nodes = document.createDocumentFragment();

  function add(path, depth, isFolder, match) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.path = path;
    button.className = 'tree-row';
    button.style.setProperty('--indent', (8 + Math.min(depth, 8) * 13) + 'px');
    button.title = path;
    const label = document.createElement('span');
    label.className = 'row-label';
    label.textContent = path.split('/').pop();
    if (match) {
      button.classList.add('search-result');
      searchResultLabel(label, path, match, terms);
    }
    if (isFolder) {
      button.classList.add('folder');
      button.setAttribute('aria-expanded', expandedFolders.has(path));
      button.append(icon('chevron'), icon('folder'), label);
      button.onclick = () => {
        if (expandedFolders.has(path)) expandedFolders.delete(path);
        else expandedFolders.add(path);
        renderTree();
      };
    } else {
      if (path === current) {
        button.classList.add('current');
        button.setAttribute('aria-current', 'page');
      }
      button.append(icon('file'), label);
      button.onclick = async () => {
        if (folderAccessPending && rememberedPaths.includes(path)) {
          await chooseFolder(true, path);
          if (current !== path || !root) return;
        } else if (path !== current || (match && hasWorkspaceFolder() && !dirty)) {
          if (!await openPath(path)) return;
        } else {
          closeSidebarOnNarrow(true);
        }
        if (match && searchQueryRevision === queryRevision && search.value === query) revealSearchMatch(terms);
      };
    }
    if (!root) {
      nodes.append(button);
    } else {
      const row = document.createElement('div');
      const actions = document.createElement('button');
      row.className = 'tree-file';
      actions.type = 'button';
      actions.className = 'icon-button file-actions-button';
      actions.title = 'Azioni per ' + path.split('/').pop();
      actions.setAttribute('aria-label', actions.title);
      actions.setAttribute('aria-controls', 'fileMenu');
      actions.setAttribute('aria-expanded', 'false');
      actions.append(icon('more'));
      actions.onclick = () => showFileMenu({ path, isFolder }, actions);
      row.append(button, actions);
      nodes.append(row);
    }
  }

  searchStatus.hidden = !searching;
  let emptyMessage = hasWorkspaceFolder() ? 'Nessun documento Markdown.' : '';
  if (searching) {
    const { matches, pending, unreadable } = searchMatches(docs, terms);
    for (const match of matches.slice(0, searchLimit)) add(match.path, 0, false, match);
    if (matches.length > searchLimit) {
      const more = document.createElement('button');
      more.type = 'button';
      more.className = 'search-more';
      more.textContent = 'Mostra altri risultati';
      more.onclick = () => {
        const next = matches[searchLimit].path;
        searchLimit += 80;
        renderTree();
        [...tree.querySelectorAll('.search-result')].find(button => button.dataset.path === next)?.focus();
      };
      nodes.append(more);
    }
    const total = matches.length;
    let status = total === 1 ? '1 risultato' : total + ' risultati';
    if (pending) status += ' · Lettura di ' + pending + ' file…';
    if (folderAccessPending) status += ' · Apri la cartella per cercare nel testo';
    if (unreadable) status += ' · ' + unreadable + (unreadable === 1 ? ' file illeggibile' : ' file illeggibili');
    if (searchStatus.textContent !== status) searchStatus.textContent = status;
    emptyMessage = pending ? 'Ricerca nel testo in corso…' : total ? '' : 'Nessun documento corrispondente.';
  } else {
    const folders = new Set([...folderHandles.keys()].filter(Boolean));
    const children = new Map();
    for (const path of docs) {
      for (let folder = parent(path); folder && !folders.has(folder); folder = parent(folder)) folders.add(folder);
    }
    for (const path of [...folders].sort((a, b) => a.localeCompare(b, 'it', { numeric: true })).concat(docs)) {
      const container = parent(path);
      if (!children.has(container)) children.set(container, []);
      children.get(container).push(path);
    }
    function walk(folder, depth) {
      for (const path of children.get(folder) || []) {
        const isFolder = folders.has(path);
        add(path, depth, isFolder);
        if (isFolder && expandedFolders.has(path)) walk(path, depth + 1);
      }
    }
    walk('', 0);
  }

  if (!nodes.childNodes.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-tree';
    empty.textContent = emptyMessage;
    nodes.append(empty);
  }
  const focusedPath = document.activeElement?.dataset.path;
  const previousScroll = tree.scrollTop;
  closeFileMenu();
  tree.replaceChildren(nodes);
  tree.scrollTop = resetSearchScroll ? 0 : previousScroll;
  resetSearchScroll = false;
  updateHistoryButtons();
  if (focusedPath) [...tree.querySelectorAll('button')].find(button => button.dataset.path === focusedPath)?.focus({ preventScroll: true });
  $('refresh').disabled = !hasWorkspaceFolder();
}

function renderOutline() {
  headings = [...ed.querySelectorAll('h1,h2,h3,h4,h5,h6')].filter(heading => heading.textContent.trim());
  $('outlineNav').hidden = sourceMode || !headings.length;
  const levels = headings.map(heading => Number(heading.tagName[1]));
  const labels = headings.map(heading => heading.textContent.trim());
  const key = JSON.stringify([levels, labels]);
  if (key === outlineKey) return;
  outlineKey = key;
  const firstLevel = Math.min(...levels);
  $('outlineList').replaceChildren(...labels.map((label, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.title = label;
    button.style.setProperty('--indent', (8 + (levels[index] - firstLevel) * 10) + 'px');
    button.onclick = () => {
      closeSidebarOnNarrow(true);
      headings[index]?.scrollIntoView({ block: 'start' });
    };
    return button;
  }));
}

function queueOutline() {
  clearTimeout(outlineTimer);
  outlineTimer = setTimeout(renderOutline, 160);
}

function setMode(wantSource, readOnlySource = false) {
  if (!current || (!editingEnabled && wantSource && !readOnlySource) || sourceMode === wantSource) return;
  closeLinkPreview();
  selectImageForResize(null);
  if (wantSource) {
    src.value = getMarkdown();
    visualScroll = workspace.scrollTop;
  }
  sourceMode = wantSource;
  if (!wantSource) {
    const markdown = dirty ? src.value : original;
    showVisual(markdown);
    if (markdown === original) savedVisualMarkdown = visualSnapshot.canonical;
  }
  renderMode();
  workspace.scrollTop = wantSource ? 0 : visualScroll;
  mark(dirty);
}

function renderMode() {
  const hasDocument = Boolean(current);
  ed.hidden = !hasDocument || sourceMode;
  $('sourcePaper').hidden = !hasDocument || !sourceMode;
  $('toolbar').hidden = !hasDocument || sourceMode || !editingEnabled;
  $('documentActions').hidden = !hasDocument;
  $('viewSwitch').hidden = !hasDocument || (!editingEnabled && !sourceMode);
  $('workStart').hidden = hasDocument;
  if (!hasDocument) renderWorkStart();
  $('main').classList.toggle('source-mode', sourceMode);
  const saveButton = $('save');
  const saveLabel = importedFolderName ? 'Scarica copia' : 'Salva';
  saveButton.querySelector('span').textContent = saveLabel;
  saveButton.setAttribute('aria-label', saveLabel);
  saveButton.title = saveLabel + ' (Ctrl/⌘ + S)';
  $('visualMode').setAttribute('aria-pressed', !sourceMode);
  $('sourceToggle').setAttribute('aria-pressed', sourceMode);
  renderEditorAccess();
  renderOutline();
  updateFormatButtons();
}

function renderWorkStart() {
  const hasIndex = folderAccessPending ? rememberedPaths.length > 0 : [...files.keys()].some(isMD);
  const folderName = root?.name || importedFolderName || (folderAccessPending ? rememberedFolder.name : localFolderName);
  const title = $('startTitle');
  const description = $('startDescription');
  const action = $('startAction');
  $('workStart').classList.toggle('has-index', hasIndex);
  title.textContent = folderName || 'Cartella di lavoro';
  if (hasIndex) {
    description.textContent = folderAccessPending
      ? 'Scegli un documento dall’ultimo elenco disponibile. Il browser potrebbe chiederti il permesso di aprirlo.'
      : 'Scegli un documento dalla barra laterale.';
    action.textContent = 'Mostra documenti';
    action.onclick = () => setSidebar(true, true);
  } else if (hasWorkspaceFolder()) {
    description.textContent = 'Questa cartella non contiene documenti Markdown.';
    action.textContent = 'Nuovo documento';
    action.onclick = newDoc;
  } else if (folderAccessPending) {
    description.textContent = 'Consenti l’accesso per vedere i documenti di questa cartella.';
    action.textContent = 'Consenti accesso';
    action.onclick = () => chooseFolder(true);
  } else {
    description.textContent = offeredImport
      ? 'Il browser non ha aperto la cartella. Puoi importarla per leggere i documenti.'
      : 'Seleziona la cartella dei documenti Markdown.';
    action.textContent = offeredImport ? 'Importa cartella' : 'Scegli cartella';
    action.onclick = offeredImport ? pickImportedFolder : () => chooseFolder();
  }
}

function updateFormatButtons() {
  const selection = getSelection();
  const node = selection?.anchorNode;
  const inside = ed.contains(node);
  const target = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
  const activeBlock = document.activeElement?.closest('pre');
  const context = inside ? target : selected?.startContainer;
  const element = context && ed.contains(context) ? (context.nodeType === Node.ELEMENT_NODE ? context : context.parentElement) : null;
  const codeBlock = ed.contains(activeBlock) || Boolean(element?.closest('pre'));
  const style = codeBlock ? 'pre' : element?.closest('code, h1, h2, h3, h4, h5, h6, blockquote')?.localName || 'p';
  const heading = $('heading');
  if (document.activeElement !== heading) {
    heading.value = style;
    heading.disabled = codeBlock;
    heading.title = heading.selectedOptions[0].textContent;
  }
  const line = codeBlock ? null : checkboxLineAt(inside ? node : context, inside ? selection.anchorOffset : selected?.startOffset);
  const checkboxes = checkboxesOnLine(line);
  $('check').setAttribute('aria-pressed', checkboxes.some(checkbox => checkbox.hasAttribute('data-task-checkbox')));
  $('inlineCheck').setAttribute('aria-pressed', checkboxes.some(checkbox => !checkbox.hasAttribute('data-task-checkbox')));
  const cell = inside && target?.closest('td,th');
  if (inside || !selected) $('code').setAttribute('aria-pressed', Boolean(target?.closest('code:not(pre code)') && inside));
  if (inside || !selected) {
    $('rowAdd').disabled = !cell;
    $('colAdd').disabled = !cell;
    for (const button of formatButtons) {
      button.setAttribute('aria-pressed', inside && document.queryCommandState(button.dataset.cmd));
    }
  }
}

$('toggle').onclick = () => setSidebar(sidebar.hidden, narrowLayout.matches);
$('closeSidebar').onclick = () => setSidebar(false, true);
$('backdrop').onclick = () => setSidebar(false, true);

$('sourceToggle').onclick = () => setMode(true);
narrowLayout.addEventListener('change', event => setSidebar(!event.matches));
setSidebar(!narrowLayout.matches);

document.addEventListener('selectionchange', updateFormatButtons);
document.addEventListener('keydown', event => {
  if ($('dialog').open || $('imagePreview').open || $('fileMenu').matches(':popover-open')) return;

});

let editingEnabled = false;
const imageResize = $('imageResize');
const imageGrip = $('imageGrip');
let selectedImage = null;
let imageDrag = null;

function canEditVisual() {
  return editingEnabled && !sourceMode && Boolean(current) && !loading && !fileActionBusy;
}

$('editToggle').onclick = () => {
  if (!current || fileActionBusy) return;
  editingEnabled = !editingEnabled;
  selected = null;
  if (!editingEnabled && sourceMode) setMode(false);
  else renderMode();
};

function renderEditorAccess() {
  const toggle = $('editToggle');
  toggle.setAttribute('aria-checked', editingEnabled);
  toggle.title = editingEnabled ? 'Disabilita modifica' : 'Abilita modifica';
  ed.contentEditable = String(editingEnabled && !sourceMode);
  ed.setAttribute('role', editingEnabled ? 'textbox' : 'document');
  if (editingEnabled) ed.setAttribute('aria-multiline', 'true');
  else ed.removeAttribute('aria-multiline');
  src.readOnly = !editingEnabled;
  selectImageForResize(null);
  configureVisualContent();
}

function configureVisualContent() {
  if (canEditVisual()) ensureCodeGaps();
  for (const gap of ed.querySelectorAll('[data-code-gap]')) gap.hidden = !editingEnabled && emptyVisualText(gap);
  decorateCheckboxes(ed);
  for (const link of ed.querySelectorAll('a[data-wiki], a[data-href]')) {
    const keyHelp = 'Ctrl/⌘ + clic per aprire';
    link.title = editingEnabled ? keyHelp : 'Apri collegamento';
    link.setAttribute('role', 'link');
    if (editingEnabled) link.removeAttribute('tabindex');
    else link.tabIndex = 0;
  }

function codeLanguage(code) {
  return code?.className.match(/(?:^|\s)language-([\w+-]+)/)?.[1] || '';

function codeBlockText(block) {
  const rendered = block.querySelector('.code-scroll code');
  return rendered ? rendered.textContent : (block.querySelector('code') || block).textContent.replace(/\n$/, '');
}

function parseDocumentMarkdown(text) {
  if (!text.includes('\t')) return marked.parse(text);

  // Marked expands leading tabs before tokenizing, including inside fenced code.
  let markerIndex = 0;
  let tabMarker;
  do {
    tabMarker = '\ue000QT' + markerIndex++ + '\ue001';
  } while (text.includes(tabMarker));
  let fence = null;
  const protectedText = text.split(/\r\n?|\n/).map(line => {
    const openingLine = fence ? line : line.replace(/^ *(?:[-+*]|\d{1,9}[.)]) +/, prefix => ' '.repeat(prefix.length));
    const match = /^( *)(`{3,}|~{3,})(.*)$/.exec(openingLine);
    if (!fence) {
      if (match && (match[2][0] !== '`' || !match[3].includes('`'))) {
        const indent = match[1].length;
        fence = { marker: match[2], maxClosingIndent: indent > 3 ? indent + 3 : 3 };
      }
      return line;
    }
    if (match && match[1].length <= fence.maxClosingIndent && match[2][0] === fence.marker[0] &&
        match[2].length >= fence.marker.length && !match[3].trim()) {
      fence = null;
      return line;
    }
    return line.replace(/^( *)(\t+)/, (_, spaces, tabs) => spaces + tabMarker.repeat(tabs.length));
  }).join('\n');
  return marked.parse(protectedText).replaceAll(tabMarker, '\t');
}

const initializedCodeBlocks = new WeakSet();

function emptyVisualText(element) {
  return !element.textContent.replaceAll(caretBoundary, '').trim() && !element.querySelector('img, input');
}

function codeNeighbor(node, direction) {
  let sibling = node[direction];
  while (sibling && (sibling.nodeType === Node.COMMENT_NODE ||
    sibling.nodeType === Node.TEXT_NODE && !sibling.textContent.trim())) sibling = sibling[direction];
  return sibling;
}

function ensureCodeGaps() {
  const createGap = () => {
    const gap = document.createElement('p');
    gap.dataset.codeGap = '';
    gap.append(document.createElement('br'));
    return gap;
  };
  for (const block of ed.querySelectorAll('pre')) {
    const before = codeNeighbor(block, 'previousSibling');
    if (!before || before.nodeName === 'PRE') block.before(createGap());
    if (!codeNeighbor(block, 'nextSibling')) block.after(createGap());
  }
}

function decorateCodeBlock(block) {
  if (initializedCodeBlocks.has(block)) return;
  initializedCodeBlocks.add(block);
  const text = codeBlockText(block);
  const code = block.querySelector('code') || document.createElement('code');
  const initialLanguage = codeLanguage(code);
  block.contentEditable = 'false';

  const header = document.createElement('span');
  header.className = 'code-block-header';
  header.dataset.codeChrome = '';
  const label = document.createElement('span');
  label.className = 'code-language-label';
  const language = document.createElement('select');
  language.className = 'code-language';
  language.setAttribute('aria-label', 'Linguaggio del blocco di codice');
  for (const [value, name] of [['', 'Testo semplice'], ...codeLanguages]) language.add(new Option(name, value));
  if (initialLanguage && ![...language.options].some(option => option.value === initialLanguage)) {
    language.add(new Option(hljs.getLanguage(highlightLanguage(initialLanguage))?.name || initialLanguage, initialLanguage));
  }
  language.value = initialLanguage;

  const copy = document.createElement('button');
  copy.type = 'button';
  copy.className = 'code-copy';
  copy.textContent = 'Copia';
  copy.setAttribute('aria-label', 'Copia codice');
  let feedbackTimer;
  copy.onclick = async () => {
    if (!await copyCodeText(codeBlockText(block))) {
      toast('Impossibile copiare il codice.');
      return;
    }
    copy.textContent = 'Copiato';
    copy.setAttribute('aria-label', 'Codice copiato');
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(() => {
      copy.textContent = 'Copia';
      copy.setAttribute('aria-label', 'Copia codice');
    }, 1600);
  };
  header.append(label, language, copy);

  const body = document.createElement('span');
  body.className = 'code-block-body';
  const gutter = document.createElement('span');
  gutter.className = 'code-gutter';
  gutter.dataset.codeChrome = '';
  gutter.setAttribute('aria-hidden', 'true');
  const numbers = document.createElement('span');
  numbers.className = 'code-line-numbers';
  gutter.append(numbers);

  const content = document.createElement('span');
  content.className = 'code-content';
  const viewer = document.createElement('span');
  viewer.className = 'code-scroll';
  viewer.setAttribute('role', 'region');
  viewer.append(code);
  const input = document.createElement('textarea');
  input.className = 'code-editor';
  input.dataset.codeChrome = '';
  input.spellcheck = false;
  input.setAttribute('autocapitalize', 'off');
  input.wrap = 'off';
  input.value = text;
  input.hidden = true;
  content.append(viewer, input);
  body.append(gutter, content);
  block.replaceChildren(header, body);

  function renderCode() {
    const value = language.value;
    const languageLabel = language.selectedOptions[0].textContent;
    block.dataset.language = languageLabel;
    label.textContent = languageLabel;
    viewer.setAttribute('aria-label', 'Codice — ' + languageLabel);
    input.setAttribute('aria-label', 'Modifica codice — ' + languageLabel);
    code.className = value ? 'language-' + value : '';
    renderHighlightedCode(code, input.value, value);
    const lines = input.value.split('\n').length;
    numbers.textContent = Array.from({ length: lines }, (_, index) => index + 1).join('\n');
    if (!input.hidden) {
      viewer.scrollTop = input.scrollTop;
      viewer.scrollLeft = input.scrollLeft;
    }
    gutter.scrollTop = viewer.scrollTop;
  }

  function changeCode() {
    renderCode();
    mark();
  }

  viewer.addEventListener('scroll', () => {
    gutter.scrollTop = viewer.scrollTop;
  });
  input.addEventListener('scroll', () => {
    viewer.scrollTop = input.scrollTop;
    viewer.scrollLeft = input.scrollLeft;
  });
  for (const type of ['beforeinput', 'paste', 'drop', 'dragover']) {
    input.addEventListener(type, event => event.stopPropagation());
  }
  input.addEventListener('keydown', event => {
    const down = event.key === 'ArrowDown';
    if ((!down && event.key !== 'ArrowUp') || event.shiftKey || event.ctrlKey || event.altKey || event.metaKey ||
        !canEditVisual() || input.selectionStart !== input.selectionEnd) return;
    const offset = input.selectionStart;
    if ((down ? input.value.slice(offset) : input.value.slice(0, offset)).includes('\n')) return;
    const paragraph = codeNeighbor(block, down ? 'nextSibling' : 'previousSibling');
    if (!paragraph?.matches?.('p, div, h1, h2, h3, h4, h5, h6') || !paragraph.isContentEditable) return;
    event.preventDefault();
    ed.focus({ preventScroll: true });
    const range = document.createRange();
    range.selectNodeContents(paragraph);
    range.collapse(down);
    placeCaret(range.startContainer, range.startOffset);
  });
  input.addEventListener('input', event => {
    event.stopPropagation();
    changeCode();
  });
  language.addEventListener('change', changeCode);
  renderCode();
}

function renderHighlightedCode(code, text, language) {
  const syntax = highlightLanguage(language);
  if (hljs.getLanguage(syntax)) code.innerHTML = hljs.highlight(text, { language: syntax, ignoreIllegals: true }).value;
  else code.textContent = text;
}

const exportPdfButton = $('exportPdf');

function supportsPdfMargins() {
  try {
    const sheet = new CSSStyleSheet();
    sheet.replaceSync('@page { @top-right { content: "Titolo"; } }');

  } catch {

}

async function choosePdfOptions() {
  const instructions = '<p>Nell’anteprima scegli <strong>Salva come PDF</strong> e disattiva <strong>Intestazioni e piè di pagina</strong> in <strong>Altre impostazioni</strong>.</p>';
  if (!supportsPdfMargins()) {
    const accepted = await modal('Esporta PDF', '<p>Per personalizzare i margini del PDF, apri Itaca in Chrome o Edge aggiornato.</p>' + instructions, 'Apri anteprima');
    return accepted ? {} : null;
  }
  const options = await modal('Opzioni PDF', `
    <div class="pdf-options">
      <fieldset>
        <legend>Intestazione</legend>
        <label><input name="title" type="checkbox" ${pdfOptions.title ? 'checked' : ''} autofocus> Nome del documento</label>
        <label class="pdf-date">Data di esportazione
          <select name="date">${pdfDateFormats.map(([value, label]) =>
            '<option value="' + value + '"' + (pdfOptions.date === value ? ' selected' : '') + '>' + label + '</option>').join('')}</select>
        </label>
      </fieldset>
      <fieldset>
        <legend>Piè di pagina</legend>
        <label><input name="path" type="checkbox" ${pdfOptions.path ? 'checked' : ''}> Percorso relativo del documento</label>
        <label><input name="pageNumbers" type="checkbox" ${pdfOptions.pageNumbers ? 'checked' : ''}> Numero di pagina</label>
      </fieldset>
      ${instructions}
    </div>`, 'Apri anteprima');
  if (!options) return null;
  pdfOptions = { title: Boolean(options.title), date: options.date, path: Boolean(options.path), pageNumbers: Boolean(options.pageNumbers) };
  try { localStorage.setItem(pdfOptionsKey, JSON.stringify(pdfOptions)); } catch {}
  return pdfOptions;
}

function pdfMarginStyles(options, title, path) {
  const quote = value => '"' + value.replace(/["\\\u0000-\u001f\u007f]/g, character => '\\' + character.charCodeAt(0).toString(16) + ' ') + '"';
  const wrap = value => {
    const characters = [...value];
    if (characters.length <= 32) return value;
    const trimmed = characters.length > 180 ? characters.slice(0, 79).join('') + '…' + characters.slice(-100).join('') : value;
    // Margin boxes need explicit break opportunities in long words and paths.
    return trimmed.replace(/[^\s/]{20}(?=[^\s/])|\/(?=\S)/gu, '$&\u200b');
  };
  const boxes = [];
  if (options.date && options.date !== 'none') {
    const format = { day: '2-digit', month: '2-digit', year: 'numeric' };
    if (options.date === 'date-time') Object.assign(format, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const date = new Intl.DateTimeFormat('it-IT', format).format(new Date());
    boxes.push('@top-left { content: ' + quote(date) + '; }');
  }
  if (options.title) boxes.push('@top-right { content: ' + quote(wrap(title)) + '; }');
  if (options.path) boxes.push('@bottom-left { content: ' + quote(wrap(path)) + '; }');
  if (options.pageNumbers) boxes.push('@bottom-right { content: counter(page) " / " counter(pages); }');
  return '@page itaca-pdf { ' + boxes.join('\n') + ' }';
}

function pdfContent() {
  if (sourceMode) return sanitize(parseDocumentMarkdown(frontSplit(src.value)[1]));

  // The visual editor already has the rendered document. Use a detached copy for printing.
  const snapshot = editorForMarkdown();
  const copy = snapshot === ed ? ed.cloneNode(true) : snapshot;
  for (const block of copy.querySelectorAll('pre')) {
    const code = block.querySelector('.code-scroll code');
    if (code) block.replaceChildren(code);
  }
  for (const image of copy.querySelectorAll('img[data-src]')) {
    image.removeAttribute('src');
    image.classList.remove('missing', 'search-image-match');
  }
  const fragment = document.createDocumentFragment();
  fragment.append(...copy.childNodes);
  return fragment;
}

exportPdfButton.onclick = async () => {
  if (!current || loading || fileActionBusy || documentOpening || folderOpening || $('dialog').open || exportPdfButton.disabled) return;
  const path = current;
  const directory = root;
  const index = files;
  const article = document.createElement('article');
  const margins = document.createElement('style');
  margins.media = 'print';
  const urls = [];
  const title = path.split('/').pop().replace(/\.(md|markdown)$/i, '');
  let previousTitle;
  const cleanUp = () => {
    article.remove();
    margins.remove();
    for (const url of urls) URL.revokeObjectURL(url);
    if (previousTitle !== undefined && document.title === title) document.title = previousTitle;
    exportPdfButton.disabled = false;
  };

  exportPdfButton.disabled = true;
  try {
    const options = await choosePdfOptions();
    if (!options) {
      cleanUp();
      return;
    }
    article.className = 'editor print-document';
    article.append(pdfContent());
    decorateCheckboxes(article);
    for (const code of article.querySelectorAll('pre code')) {
      renderHighlightedCode(code, code.textContent, codeLanguage(code));
    }
    for (const link of article.querySelectorAll('a[data-href]')) {
      if (/^(https?:\/\/|mailto:)/i.test(link.dataset.href)) link.href = link.dataset.href;
    }
    await Promise.all([...article.querySelectorAll('img[data-src]')].map(async image => {
      try {
        const file = await documentImage(image, path, index);
        if (file) {
          const url = URL.createObjectURL(file);
          urls.push(url);
          image.src = url;
          await image.decode();
          return;
        }
      } catch {}
      image.replaceWith(document.createTextNode('[' + (image.alt || 'Immagine non disponibile') + ']'));
    }));
    const hasContent = article.textContent.trim() || article.querySelector('img, input, hr, pre, table');
    if (current !== path || root !== directory || !hasContent) {
      if (current === path) toast('Il documento è vuoto.');
      cleanUp();
      return;
    }
    previousTitle = document.title;
    document.title = title;
    margins.textContent = pdfMarginStyles(options, title, path);
    document.head.append(margins);
    document.body.append(article);
    window.addEventListener('afterprint', cleanUp, { once: true });
    window.print();
  } catch (error) {
    window.removeEventListener('afterprint', cleanUp);
    cleanUp();
    toast('Impossibile esportare il PDF: ' + error.message);
  }
};

function highlightLanguage(language) {
  const name = language.toLowerCase();
  if (name === 'c#') return 'csharp';
  if (name === 'c++') return 'cpp';
  return name || 'plaintext';
}

async function copyCodeText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const focus = document.activeElement;
    const temporary = document.createElement('textarea');
    temporary.value = text;
    temporary.readOnly = true;
    temporary.style.cssText = 'position:fixed;opacity:0;left:-9999px;';
    document.body.append(temporary);
    try {
      temporary.select();
      return document.execCommand('copy');
    } catch {
      return false;
    } finally {
      temporary.remove();
      focus?.focus({ preventScroll: true });
    }
  }
}

function insertCodeBlock() {
  if (!canEditVisual()) return;
  remember();
  const activeBlock = document.activeElement.closest('pre');
  const text = activeBlock ? '' : selected?.toString() || '';
  const node = selected?.startContainer;
  const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
  let enclosing = activeBlock || element?.closest('li, table, blockquote, pre');
  if (enclosing && ed.contains(enclosing)) {
    while (enclosing.parentElement !== ed) enclosing = enclosing.parentElement;
    const range = document.createRange();
    range.setStartAfter(enclosing);

    selected = range;
  }
  addHTML('<pre data-new-code-block contenteditable="false"><code>' + escapeHtml(text) + '\n</code></pre><p data-code-gap><br></p>');

    block.querySelector('.code-editor')?.focus();

}

const imageResizeObserver = new ResizeObserver(positionImageResize);

function selectImageForResize(image) {

function imageWidthLimits() {
  const container = selectedImage.closest('td,th') || ed;
  const style = getComputedStyle(container);
  const max = Math.max(1, Math.min(99999, Math.floor(container.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight))));
  return { min: Math.min(24, max), max };
}

function positionImageResize() {
  const image = selectedImage;
  if (!image?.isConnected || !canEditVisual()) {
    imageResize.hidden = true;
    return;
  }
  const bounds = image.getBoundingClientRect();
  const area = imageResize.parentElement.getBoundingClientRect();
  const visible = workspace.getBoundingClientRect();
  const left = Math.max(visible.left, bounds.left);
  const controls = $('documentActions').getBoundingClientRect();
  const top = Math.max(visible.top, controls.bottom + 4, bounds.top);
  const width = Math.min(visible.right, bounds.right) - left;
  const height = Math.min(visible.bottom, dock.getBoundingClientRect().top - 4, bounds.bottom) - top;
  imageResize.hidden = width <= 0 || height <= 0;
  if (imageResize.hidden) return;
  Object.assign(imageResize.style, { left: left - area.left + 'px', top: top - area.top + 'px', width: width + 'px', height: height + 'px' });
  const pixels = Math.round(bounds.width);
  const { min, max } = imageWidthLimits();
  $('imageSize').textContent = pixels + ' px';
  imageGrip.setAttribute('aria-valuemin', Math.min(min, pixels));
  imageGrip.setAttribute('aria-valuemax', Math.max(max, pixels));
  imageGrip.setAttribute('aria-valuenow', pixels);
  imageGrip.setAttribute('aria-valuetext', pixels + ' pixel');
}

function resizeImage(width) {
  const { min, max } = imageWidthLimits();
  selectedImage.setAttribute('width', Math.max(min, Math.min(max, Math.round(width))));
  positionImageResize();
}
